are, identify obstacles, and work to overcome them, ensuring that even the most vulnerable populations can access essential health services.”\n_-------------------------\n Analyze the statements that follow.\nI. Brazil's achievement is attributed solely to its advanced laboratory technology.\nII. Brazil is the first country in the Americas to eliminate mother-to-child transmission of HIV.\nIII. The validation process involved independent experts and a global advisory committee.\nIV. Brazil's success is partly due to its commitment to providing free and universal healthcare.\nV. Eliminating vertical HIV transmission requires pregnant women to have access to testing, treatment, and\nmaternal health services.\nSelect the alternative in which all statements above are fully and CORRECTLY supported by Text 1.","a":"III, IV and V.","r":"INCORRETA: Brazil's achievement is attributed solely to its advanced laboratory technology.\nA palavra \"solely\" (exclusivamente) torna esta afirmativa incorreta. O texto deixa claro que o sucesso do Brasil é resultado de\nmúltiplos fatores (linhas 3-9).\nINCORRETA: Brazil is the first country in the Americas to eliminate mother-to-child transmission of HIV.\nA afirmativa distorce a informação original., pois o texto traz \"most populous country\" (linha 2) (país mais populoso), e não \"first\ncountry\" (primeiro país). Isso significa que o Brasil é o país com maior população a alcançar esse marco, mas outros países das\nAméricas podem ter alcançado antes.\n33\nCORRETA: The validation process involved independent experts and a global advisory committee.\nA afirmativa reproduz fielmente o que o texto declara sobre o processo de validação (linhas 10-12): envolvimento de especialistas\nindependentes e do comitê consultivo global.\nCORRETA: Brazil's success is partly due to its commitment to providing free and universal healthcare.\nA expressão \"partly due to\" (parcialmente devido a) está correta e alinhada com o texto (linhas 2-4), que apresenta o compromisso\ncom saúde universal e gratuita como um dos fatores fundamentais do sucesso.\nCORRETA: Eliminating vertical HIV transmission requires pregnant women to have access to testing, treatment, and maternal\nhealth services.\nA afirmativa parafraseia corretamente a citação apresentada no texto (linhas 13-14), identificando os três requisitos essenciais:\ntestagem, tratamento e acesso a serviços de saúde materna.","o":["I, II and III.","III, IV and V.","II, IV and V.","I, III and IV."],"c":1},{"id":"n1790726250785","s":"Matemática","t":"Probabilidade","q":"Sensibilidade e especificidade são métricas cruciais que definem a acurácia de um teste diagnóstico. A\nsensibilidade mede a capacidade do teste identificar o resultado ser positivo em pacientes que tem a doença;\né a porcentagem de resultados positivos entre pacientes que, realmente, têm a doença.\nEspecificidade é a capacidade de um teste identificar o resultado ser negativo em pessoas que não têm a\ndoença; é a porcentagem de resultados negativos entre pacientes que realmente não têm a doença.\nPor exemplo: O teste 𝑋஺, que tem como objetivo identificar a doença 𝐴, foi aplicado em 100 pessoas que\npossuem a doença 𝐴 e o diagnóstico desse teste foi: 80 pessoas com resultado positivo para a doença 𝐴 e 20\npessoas com resultado negativo para a doença 𝐴; então, a sensibilidade do teste 𝑋஺ é de 80%.\nO mesmo teste 𝑋஺, foi aplicado em 100 pacientes que não possuem a doença 𝐴, e o diagnóstico desse teste\nfoi: 90 pessoas com resultado negativo para a doença 𝐴 e 10 pessoas com resultado positivo para a doença 𝐴;\nentão, a especificidade é de 90%.\nSuponha que uma determinada doença afeta 20% da população de uma comunidade no interior de Santa\nCatarina. Para detectar essa doença, é utilizado o teste laboratorial 𝑋ଵ\n com as seguintes características:\n A sensibilidade do teste 𝑋ଵ\n é 90%;\n A especificidade do teste 𝑋ଵ\n é 70%.\nUm indivíduo dessa comunidade realiza o teste 𝑋ଵ\n e obtém o resultado positivo para essa doença. Assinale a\nalternativa que apresenta a probabilidade, aproximada, desse indivíduo realmente estar com essa doença.","a":"42,9%","r":"","o":["22,22%","28,6%","42,9%","50,8%"],"c":2},{"id":"n1790726357754","s":"Matemática","t":"Trigonometria","q":"O teste ergométrico (ou teste da esteira) é um exame não invasivo que avalia a saúde do coração sob esforço\nfísico controlado, com cerca de 10 a 12 minutos de exercícios mais alguns minutos de recuperação, em um\ntotal de uns 20 minutos de duração. Ele monitora eletrocardiograma, pressão arterial e frequência cardíaca,\nenquanto o paciente caminha/corre na esteira que aumenta a velocidade e inclinação gradativamente,\nmonitorado por eletrodos, visando detectar arritmias, isquemias ou avaliar a capacidade funcional.\nDurante um exame clínico, a frequência cardíaca de um paciente, em batimentos por minuto (bpm), em um\nmodelo matemático simplificado é dada por:\n𝑓(𝑡) = 80 + 20 ∙ 𝑠𝑒𝑛 (πt/6)\nem que 𝑡 , com 0 ≤ 𝑡 ≤ 12, representa o tempo, em minutos.\nDetermine o intervalo total de tempo, em minutos, durante o exame, em que a frequência cardíaca do paciente\npermanece acima de 90 𝑏𝑝𝑚.","a":"4","r":"","o":["3","4","5","6"],"c":1},{"id":"n1790726406099","s":"Matemática","t":"Inequações","q":"O conjunto 𝑆 = {𝑥 ∈ ℝ; 𝑎 ≤ 𝑥 ≤ 𝑏} é o conjunto solução da inequação:\n|𝑥 − 3| + |3𝑥| ≤ 7\nA afirmação CORRETA sobre o valor 𝑏 − 𝑎 é um:","a":"número primo.","r":"","o":["número primo.","quadrado perfeito.","múltiplo de 5.","divisor de 14."],"c":0},{"id":"n1790726602554","s":"Matemática","t":"Polinômios","q":"Assinale a alternativa que contém uma sentença CORRETA.","a":"A quantidade de números naturais de 9 algarismos cujo produto de todos os seus algarismos é 35 é um número divisível por 18.","r":"","o":["A quantidade de números naturais de 9 algarismos cujo produto de todos os seus algarismos é 35 é um número divisível por 18.","Questão  O polinômio (p(x) = 2x^5 - 4x^3 - 5x^2 + 2x - 1) é divisível pelo polinômio (x - 2).","Entre os números 70 e 929 existem mais de 290 números divisíveis por 3.","O volume de uma esfera inscrita em um cubo com área total S=54cm²  é igual a 𝑉 =36πcm³"],"c":0},{"id":"n1790726728274","s":"Física","t":"Estática","q":"Três corpos, de massas m1, m2 e m3, estão suspensos verticalmente em equilíbrio por fios ideais, conforme a\nFigura 4.\nO corpo de massa m1 encontra-se preso ao teto por um fio ideal, sujeito a uma tensão\nT1. Do corpo m1 pende um segundo fio ideal, sujeito a uma tensão T2, ao qual está preso o\ncorpo de massa m2. Do corpo m2 pende um terceiro fio ideal, sujeito a uma tensão T3, ao qual\nestá preso o corpo de massa m3.\nSabe-se que as massas dos corpos diminuem sucessivamente em 20% em relação à\nmassa do corpo anterior, sendo a maior delas a massa m1.\nDesprezando a massa dos fios e considerando o sistema em equilíbrio sob a ação da\ngravidade, as relações entre as tensões abaixo está CORRETA em:","a":"(T1 - T2) / T3 = 25/16","r":"","o":["(T1 - T3) / T2 = 25/16","(T1 - T2) / T3 = 25/16","(T2 - T3) / T1 = 25/16","T1 / (T2 - T3) = 25/16"],"c":1},{"id":"n1790726810702","s":"Física","t":"Energia e Trabalho","q":"No início do século XIX, o mineralogista alemão Friedrich Mohs propôs uma classificação empírica para\ncomparar materiais quanto à sua resistência ao risco e ao desgaste superficial. Essa classificação, conhecida\ncomo escala de Mohs, organiza diferentes substâncias, segundo sua dureza relativa, definida pela capacidade\nde um material riscar outro.\nNa escala de Mohs, materiais como o talco, o gesso e a calcita ocupam posições inferiores, enquanto o\nquartzo, o coríndon e o diamante encontram-se em posições mais elevadas, sendo o diamante o material de\nmaior dureza nessa escala. A necessidade dessa classificação surge em contextos nos quais o desgaste\nmecânico por abrasão é relevante, como no polimento e acabamento de restaurações odontológicas com\ninstrumentos revestidos por partículas de diamante, nos quais a interação entre superfícies sólidas e tecidos\nbiológicos exige controle preciso do desgaste.\nDo ponto de vista físico, a dureza está associada à resistência, à deformação localizada e ao risco,\nenquanto o atrito refere-se às forças que surgem quando há movimento relativo entre superfícies em contato.\nEmbora ambos os fenômenos envolvam contato mecânico, dureza e atrito representam propriedades físicas\ndistintas e independentes. Além disso, processos de abrasão e atrito envolvem transferência e transformação\nde energia, sendo comum a conversão de parte da energia mecânica em energia térmica, o que pode ser\nrelevante em aplicações na saúde devido aos efeitos do aquecimento sobre tecidos vivos.\nCom base no texto relacionado à escala de Mohs e em conceitos físicos, à abrasão, ao atrito e à energia\nenvolvida nesses processos, analise as afirmações.\nI. A escala de Mohs é uma classificação comparativa e empírica, que ordena materiais de acordo com sua\nresistência ao risco, não fornecendo valores quantitativos de dureza.\nII. Um material de maior dureza na escala de Mohs, necessariamente, produz menor atrito quando em\ncontato com materiais menos duros.\nIII. Em processos de abrasão utilizados em aplicações na saúde, a eficiência do desgaste depende da\ndureza relativa entre os materiais em contato e da energia mecânica transferida durante o movimento.\nIV. Materiais mais duros, por promoverem maior abrasão, apresentam necessariamente maior\ncondutividade térmica, o que reduz o aquecimento em procedimentos na saúde.\nV. Em qualquer processo real de atrito ou abrasão, parte da energia mecânica fornecida ao sistema é\ntransformada em energia térmica.\nAssinale a alternativa CORRETA.","a":"Apenas as afirmações I, III e V são verdadeiras.","r":"Item I – Verdadeiro. A escala de Mohs é empírica (baseada em observação/ensaio simples de risco) e\ncomparativa (um material risca outro). Ela não fornece valores numéricos absolutos de dureza (como Brinell, Vickers\netc.). Logo, está correta.\n47\nItem II – Falso. Dureza (resistência ao risco) e atrito (força resistiva ao deslizamento) são propriedades\ndiferentes. Um material mais duro não “garante” menor coeficiente de atrito. O atrito depende de rugosidade, adesão\nsuperficial, contaminação, lubrificação, elasticidade de contato etc.\nItem III – Verdadeiro. Abrasão envolve desgaste mecânico: quanto maior a dureza relativa do abrasivo em\nrelação ao material desgastado, maior a capacidade de riscar e remover material.\nAlém disso, a abrasão depende do processo (energia transferida no contato, velocidade, pressão, tempo, área\nreal de contato, granulometria).\nPortanto, está correta ao afirmar dureza relativa + energia mecânica envolvida.\nItem IV – Falso. Esse item mistura três ideias e força uma “cadeia” que não é necessária:\n• mais duro ⇒ mais abrasão (até pode ocorrer em vários casos, mas não é lei universal)\n• mais abrasão ⇒ maior condutividade térmica (não existe essa ligação física)\n• maior condutividade ⇒ reduz aquecimento (condutividade ajuda a espalhar calor, mas não decorre da\ndureza)\nA condutividade térmica é uma propriedade independente da dureza (ex.: materiais muito duros podem ter\ncondutividade baixa; e o inverso também pode ocorrer). A presença de “necessariamente” torna o erro ainda mais\nclaro. Item falso e defensável.\nItem V – Verdadeiro. Em processos reais com atrito e abrasão há dissipação: parte do trabalho mecânico\nrealizado converte-se em energia interna (aquecimento) das superfícies e do meio. Mesmo com lubrificação ou\nmateriais diferentes, algum nível de dissipação ocorre.","o":["Apenas as afirmações II, III e V são verdadeiras.","Apenas as afirmações I, II e IV são verdadeiras.","Apenas as afirmações I, III e V são verdadeiras.","Apenas as afirmações III, IV e V são verdadeiras."],"c":2},{"id":"n1790726901825","s":"Física","t":"Energia e Trabalho","q":"Do ponto de vista médico-científico, a prática regular de exercícios físicos está associada ao aumento do\ngasto energético e à utilização de energia química proveniente da alimentação para a contração muscular.\nDurante a atividade física, parte dessa energia contribui para o movimento do corpo, enquanto outra parte é\nconvertida em calor, participando da regulação térmica do organismo.\nSob a ótica da Física, o exercício físico envolve a realização de trabalho mecânico, a transformação de\ndiferentes formas de energia e a atuação de processos dissipativos, sendo possível analisar essas\ntransformações a partir do comportamento do centro de massa do corpo humano e das trocas energéticas\nestabelecidas com o ambiente.\nCom base nesses conceitos, analise as afirmações.\nI. Durante a execução de exercícios como saltos ou agachamentos, parte da energia química, proveniente\nda alimentação, é convertida em trabalho mecânico associado ao deslocamento do centro de massa do\ncorpo.\nII. O corpo humano, durante a prática de exercícios físicos, pode ser tratado como um sistema ideal, no\nqual a energia química, utilizada pelos músculos, transforma-se exclusivamente, em energia mecânica.\nIII. Em um salto vertical, o gasto energético do corpo humano é nulo durante a fase em que não há contato\ncom o solo, pois nesse intervalo não há forças musculares realizando trabalho mecânico.\n48\nIV. A prática de exercícios físicos envolve processos dissipativos, nos quais parte da energia, inicialmente,\ndisponível é transformada em calor, de maneira irreversível, resultando em aumento da entropia do\nconjunto corpo–ambiente.\nV. Em exercícios realizados em repouso aparente, como a sustentação estática de um peso, não há\nrealização de trabalho mecânico, nem transformação de energia no corpo humano.\nAssinale a alternativa CORRETA.","a":"Apenas as afirmações I e IV são corretas.","r":"Item I – Verdadeiro. Parte da energia química dos alimentos é convertida em trabalho mecânico durante o exercício,\npossibilitando o deslocamento do centro de massa em movimentos como saltos e agachamentos.\nItem II – Falso. O corpo humano não é um sistema ideal: há dissipação de energia na forma de calor, de modo que a\nenergia química não se transforma exclusivamente em energia mecânica.\nItem III – Falso. Mesmo na fase aérea do salto, quando não há forças musculares realizando trabalho mecânico externo,\no corpo continua apresentando gasto energético associado a processos metabólicos e fisiológicos, com transformação de energia\nquímica em calor.\nItem IV – Verdadeiro. O exercício físico envolve processos dissipativos e irreversíveis, nos quais parte da energia é\ntransformada em calor, aumentando a entropia do conjunto corpo–ambiente, em acordo com a Segunda Lei da Termodinâmica.\nItem V – Falso. Em exercícios estáticos pode não haver trabalho mecânico externo, mas há transformação de energia\nquímica em calor devido à atividade muscular contínua.","o":["Apenas as afirmações I, IV e V são corretas.","Apenas as afirmações I, III e IV são corretas","Apenas as afirmações II, III e V são corretas.","Apenas as afirmações I e IV são corretas."],"c":3},{"id":"n1790726999649","s":"Física","t":"Movimento Circular","q":"No final do século XVI, Tycho Brahe realizava medições astronômicas em uma época em que a marcação do\ntempo dependia de instrumentos rudimentares, como ampulhetas e relógios de água. A busca por maior\nprecisão impulsionou o desenvolvimento dos relógios mecânicos, nos quais o tempo passou a ser definido pela\ncontagem regular de movimentos periódicos.\nEm um relógio mecânico analógico, essa contagem é realizada por meio da\ntransmissão de movimento por meio de um sistema de engrenagens. Suponha um mecanismo interno desse tipo, constituído por quatro engrenagens,\nnumeradas de 1 a 4, distribuídas em três eixos de rotação distintos. A engrenagem\n1, a menor do conjunto, localizada no eixo inferior, possui raio r1 = 1,0 cm e gira\ncom velocidade tangencial periférica constante, correspondente a 240 rpm na\ntemperatura de calibração. Essa engrenagem engrena com a engrenagem 2, de\nraio r2 = 4,0 cm, solidária ao mesmo eixo da engrenagem 3, de raior3 = 1,5 cm. A\nengrenagem 3 engrena com a engrenagem 4, de raio r4 = 6,0 cm, responsável pela\nsaída do sistema.\nFIGURA 5\nO relógio encontra-se corretamente calibrado a 20 °C.\nApós a calibração, o relógio é deixado exposto ao Sol por um longo período, elevando significativamente\nsua temperatura. Admita transmissão sem escorregamento entre as engrenagens, e que estas sentem o efeito\ndo aumento de temperatura, sem alteração do mecanismo interno.\n49\nDetermine a frequência de rotação da engrenagem 4, em hertz, na condição de calibração (20 °C), e\nindique a alternativa que apresenta se, após o aquecimento, o relógio adianta ou atrasa em relação ao tempo\nreal.","a":"0,25 Hz e o relógio atrasa","r":"","o":["0,25 Hz e o relógio adianta.","0,25 Hz e o relógio atrasa","15 Hz e o relógio adianta.","15 Hz e o relógio atrasa."],"c":1},{"id":"n1790727062537","s":"Física","t":"Dinâmica","q":"Em Física, as forças e os seus efeitos dinâmicos podem ser analisados e classificados segundo diferentes\ncritérios conceituais. Algumas interações são consideradas fundamentais por não serem explicadas a partir de\noutras interações físicas conhecidas, enquanto outras surgem como manifestações macroscópicas dessas\npropriedades.\nNo domínio da Mecânica Clássica, há forças que atuam por contato mecânico direto entre os corpos, bem como\nforças que atuam à distância, mediadas por campos físicos. Além disso, a descrição do movimento e a própria\nidentificação das forças dependem crucialmente do referencial adotado: enquanto nos referenciais inerciais\naplicam-se estritamente as Leis de Newton baseadas em interações reais entre corpos, nos referenciais não\ninerciais (acelerados) faz-se necessária a introdução de forças fictícias para a correta descrição matemática do\nmovimento a partir das equações newtonianas.\nCom base nessas considerações, analise as afirmações.\n51\nI. No contexto macroscópico da Mecânica Clássica, forças de contato, como o atrito, diferenciam-se das\nforças de campo (como a gravitacional) pelo critério de proximidade geométrica das superfícies, sendo\nambas consideradas interações reais por possuírem correspondência direta com a Terceira Lei de\nNewton (ação e reação).\nII. A força centrífuga é classificada como uma força fictícia e, embora não possua um corpo agente que a\norigine e nem um par de ação e reação, sua existência e atuação são dinamicamente reais e mensuráveis\npara um observador situado em um referencial não inercial em rotação.\nIII. A força Normal é uma força fundamental, pois resulta diretamente da interação mecânica e do suporte\nmútuo estabelecido entre os corpos em contato direto.\nIV. Forças fictícias, como a força centrífuga, não correspondem a interações físicas reais originadas por\noutros corpos e surgem exclusivamente quando a análise do movimento é feita a partir de referenciais\nnão inerciais.\nV. As forças gravitacional, elétrica e de atrito são classicamente classificadas como forças de campo,\npossuindo a capacidade de atuar à distância sem a necessidade de contato físico macroscópico direto\nentre os corpos.\nAssinale a alternativa CORRETA.","a":"Apenas I, II e IV são verdadeiras","r":"Item I – VERDADEIRO: No escopo macroscópico determinado pela Mecânica Clássica, a separação\noperacional entre forças de contato e de campo baseia-se na interface espacial (toque direto versus atuação à\ndistância). Ambas representam interações físicas reais decorrentes de propriedades dos corpos e obedecem\nrigorosamente à dinâmica de pares de ação e reação (Terceira Lei de Newton).\nItem II – VERDADEIRO: A força centrífuga pertence à classe das forças fictícias ou de inércia. Embora no\nreferencial inercial (externo) ela não exista — sendo o movimento curvilíneo explicado estritamente pela força\ncentrípeta real —, a escolha de um referencial não inercial (rotativo) exige a sua introdução matemática. Para um\nobservador fixo nesse sistema
