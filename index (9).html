<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Szimanki</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--p1:var(--c1);--p2:var(--c2);--hd:var(--c2);--lk:var(--c1);--bgA:var(--b1);--bgB:var(--b2);--card:#fff;--card2:#faf8f3;--glow:rgba(255,255,255,.95);--trk:#efe1de;--trk2:rgba(22,33,58,.1);--rd:#a33a2a;--rdb:#dcaaa2;--bgbad:#fbe9e6;--okbg:#e8f5ee;--okb:#2f8f6b;--nobg:#fbeceb;--nob:#c4574a;--c1:#2f4a7d;--c2:#1b2b52;--b1:#f8f6f1;--b2:#e6ebf2;--ac:#b8893a;--ink:#16213a;--mu:#5d6883;--ln:rgba(22,33,58,.11);--sh:0 1px 2px rgba(22,33,58,.06),0 10px 28px rgba(22,33,58,.08)}
*{box-sizing:border-box}
html{background:var(--bgB);color-scheme:light}
body{margin:0;min-height:100vh;color:var(--ink);font:400 16px/1.55 "Inter","Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;background:radial-gradient(900px 420px at 50% -8%,var(--glow),transparent 70%),linear-gradient(170deg,var(--bgA),var(--bgB)) fixed}
main{max-width:720px;margin:0 auto;padding:20px 20px 64px;padding-top:max(20px,env(safe-area-inset-top))}
.logo{font-family:"Playfair Display",Georgia,serif;font-weight:700;margin:0;line-height:1.05;letter-spacing:-.01em;color:var(--hd)}
.logo.big{font-size:clamp(3rem,13vw,5.2rem);text-align:center;margin-top:36px}
.logo.big::after{content:"";display:block;width:56px;height:3px;border-radius:3px;background:var(--ac);margin:18px auto 0}
.tag{text-align:center;font-size:1.05rem;color:var(--mu);margin:16px 0 44px}
.h2,.h3,.big b,.panel h3,.pill b{font-family:"Playfair Display",Georgia,serif;font-weight:700}
.h2{font-size:clamp(1.7rem,5.5vw,2.3rem);line-height:1.15;margin:26px 0 18px;color:var(--hd)}
.h3{font-size:1.1rem;margin:0 0 12px;color:var(--hd)}
.menu{display:grid;gap:14px;max-width:640px;margin:0 auto}
.big{position:relative;display:flex;flex-direction:column;justify-content:center;gap:4px;width:100%;min-height:96px;border:1px solid var(--ln);border-radius:20px;padding:20px 64px 20px 28px;text-align:left;cursor:pointer;color:var(--ink);background:var(--card);box-shadow:var(--sh);transition:transform .18s,box-shadow .18s,border-color .18s}
.big::before{content:"";position:absolute;left:0;top:20px;bottom:20px;width:4px;border-radius:0 4px 4px 0;background:linear-gradient(var(--p1),var(--p2))}
.big::after{content:"→";position:absolute;right:26px;top:50%;transform:translateY(-50%);font-size:1.4rem;color:var(--ac);transition:transform .18s}
.big:hover{transform:translateY(-2px);border-color:var(--ac);box-shadow:0 2px 4px rgba(22,33,58,.06),0 18px 36px rgba(22,33,58,.13)}
.big:hover::after{transform:translate(4px,-50%)}
.big b{font-size:1.3rem;color:var(--hd)}
.big small{font-size:.92rem;color:var(--mu)}
.panel,.cp{background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:22px;margin-bottom:16px;box-shadow:var(--sh)}
.panel h3{font-size:1.25rem;margin:0 0 14px;cursor:pointer;display:flex;align-items:center;gap:10px;color:var(--hd)}
.panel h3::before{content:"";width:3px;height:1.1em;border-radius:3px;background:var(--ac)}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip{border:1px solid var(--ln);border-radius:12px;padding:9px 8px;min-height:44px;background:var(--card);font:inherit;font-weight:500;font-size:.85rem;color:var(--ink);cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--ac);color:var(--hd)}
.chip.on{background:linear-gradient(180deg,var(--p1),var(--p2));color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(27,43,82,.25)}
.chip.z{opacity:.55}
.tog{width:100%;min-height:50px;margin-bottom:16px;font-size:.95rem}
.cta{display:inline-block;border:0;border-radius:14px;padding:14px 30px;margin:6px;background:linear-gradient(180deg,var(--p1),var(--p2));font:inherit;font-weight:600;font-size:1rem;letter-spacing:.01em;color:#fff;cursor:pointer;text-decoration:none;box-shadow:0 8px 20px rgba(27,43,82,.25);transition:transform .15s,box-shadow .15s}
.cta:hover{transform:translateY(-1px);box-shadow:0 12px 26px rgba(27,43,82,.3)}
.cta.bad{background:var(--card);color:var(--rd);border:1.5px solid var(--rdb);box-shadow:none}
.center{text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
.top{display:flex;align-items:center;gap:12px}
.top .logo{font-size:1.6rem;flex:1;text-align:center;margin-right:44px}
.back{width:44px;height:44px;border:1px solid var(--ln);border-radius:50%;background:var(--card);box-shadow:var(--sh);font-size:1.2rem;color:var(--hd);cursor:pointer;transition:border-color .15s}
.back:hover{border-color:var(--ac)}
.lnk{border:0;background:none;font:inherit;font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:6px 0;color:var(--lk)}
.pills{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.pill{flex:1;min-width:140px;text-align:center;border-radius:18px;padding:16px;background:var(--card);border:1px solid var(--ln);box-shadow:var(--sh);font-size:.9rem;color:var(--mu)}
.pill.wide{flex-basis:100%}
.pill b{display:block;font-size:1.9rem;color:var(--hd)}
.bar{height:8px;border-radius:99px;background:var(--trk);overflow:hidden}
.bar i{display:block;height:100%;background:#2f8f6b;border-radius:99px}
.bar.n{background:var(--trk2)}
.prog{height:6px;border-radius:99px;background:var(--trk2);overflow:hidden;margin-top:14px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--p1),var(--ac));transition:width .3s}
.sr{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.grp{padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--ln)}
.sub{margin:8px 0 0 14px;font-size:.92rem}
.li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln)}
.li[role=button]{cursor:pointer}
.li small{color:var(--mu)}
.li button{border:0;background:none;color:var(--rd);font-size:1.25rem;cursor:pointer}
.badge{background:var(--bgbad);color:var(--rd);border-radius:99px;padding:1px 10px;align-self:center;white-space:nowrap;font-size:.8rem;font-weight:600}
.mut{color:var(--mu);font-size:.9rem}
.warn{color:var(--rd);font-weight:600}
input,textarea,select{width:100%;border:1px solid var(--ln);border-radius:12px;padding:12px 14px;margin-bottom:10px;font:inherit;color:var(--ink);background:var(--card)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px rgba(184,137,58,.2)}
input[type=color]{height:44px;padding:4px}
textarea{resize:vertical}
label{display:block;font-size:.85rem;font-weight:500;color:var(--mu);margin-bottom:6px}
label input{margin-top:4px}
details{border-top:1px solid var(--ln);padding:10px 0}
summary{cursor:pointer;font-weight:600;color:var(--hd)}
.ed{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fe{background:var(--card2);border:1px dashed var(--ac);border-radius:16px;padding:14px;margin:8px 0}
.mcf{display:none}.mc .mcf{display:block}.mc .sf{display:none}
.fc{perspective:1000px;min-height:340px;cursor:pointer;margin:14px 0}
.fc .in{position:relative;min-height:340px;transition:transform .5s;transform-style:preserve-3d}
.fc.flip .in{transform:rotateY(180deg)}
.face,.qbox{background:var(--card);border:1px solid var(--ln);border-radius:24px;padding:32px;text-align:center;font:600 1.45rem/1.4 "Playfair Display",Georgia,serif;color:var(--hd);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 4px rgba(22,33,58,.05),0 20px 44px rgba(22,33,58,.12)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.back{transform:rotateY(180deg);background:linear-gradient(160deg,var(--p1),var(--p2));color:#fff;border-color:transparent}
.qbox{min-height:190px;margin:14px 0}
.opts{display:grid;grid-template-columns:1fr;gap:10px;margin:12px 0}
.opt{border:1px solid var(--ln);border-radius:14px;padding:15px 18px;background:var(--card);font:inherit;font-weight:500;font-size:1rem;text-align:left;color:var(--ink);cursor:pointer;transition:.15s;box-shadow:0 2px 8px rgba(22,33,58,.05)}
.opt:hover:not(:disabled){border-color:var(--ac)}
.opt:disabled{cursor:default;color:var(--ink)}
.opt.ok{background:var(--okbg);border-color:var(--okb)}
.opt.no{background:var(--nobg);border-color:var(--nob)}
.rv{background:var(--card);border:1px solid var(--ln);border-left:4px solid var(--ac);border-radius:16px;padding:16px 18px;margin:14px 0;box-shadow:var(--sh)}
.rv p{margin:0 0 12px}
.ph{border:1px dashed var(--ln);border-radius:12px;padding:14px;text-align:center;color:var(--mu)}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
@media (min-width:800px){main{max-width:960px}.chips{grid-template-columns:repeat(4,1fr)}.opts{grid-template-columns:1fr 1fr}.pill.wide{flex-basis:auto}.menu{max-width:none;grid-template-columns:repeat(3,1fr)}.big{min-height:140px}}
@media (prefers-reduced-motion:reduce){.fc .in,.prog i,.big,.cta{transition:none}}
.tm{position:fixed;top:max(14px,env(safe-area-inset-top));right:14px;z-index:10;width:44px;height:44px;border-radius:50%;border:1px solid var(--ln);background:var(--card);color:var(--hd);box-shadow:var(--sh);cursor:pointer;font-size:1.15rem;line-height:1}
.tm:hover{border-color:var(--ac)}
.pk{display:flex;flex-wrap:wrap;gap:6px;margin:-2px 0 10px}
.pk:empty{display:none}
.pk .chip{min-height:34px;padding:4px 12px;font-size:.8rem}
:root[data-theme="dark"]{color-scheme:dark;--bgA:#0e1420;--bgB:#0a0e17;--glow:rgba(90,120,190,.16);--card:#151d2e;--card2:#111827;--ink:#e8ecf5;--mu:#98a3bd;--ln:rgba(200,215,255,.14);--sh:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);--p1:#4a6cb3;--p2:#34508f;--hd:#eef1f9;--lk:#9db7ee;--trk:rgba(255,110,90,.2);--trk2:rgba(255,255,255,.1);--rd:#f0857a;--rdb:#8a4a44;--bgbad:rgba(240,133,122,.15);--okbg:#12301f;--okb:#3fae80;--nobg:#3a1a1a;--nob:#d0685a}
</style>
</head>

var EMB=/*EMB*/[{"id":"d0","s":"Física","t":"Cinemática","q":"Qual a fórmula da velocidade média?","a":"v = Δs / Δt","r":"Velocidade média é a variação de posição dividida pelo intervalo de tempo. No SI, a unidade é m/s."},{"id":"d1","s":"Física","t":"Cinemática","q":"Um carro vai de 0 a 20 m/s em 4 s. Qual a aceleração média?","a":"5 m/s²","r":"Aceleração média = Δv/Δt = 20/4 = 5 m/s².","o":["2 m/s²","5 m/s²","10 m/s²","80 m/s²"],"c":1},{"id":"d2","s":"Física","t":"Dinâmica","q":"Enuncie a 2ª Lei de Newton.","a":"F = m·a","r":"A força resultante sobre um corpo é igual à massa vezes a aceleração."},{"id":"d3","s":"Física","t":"Dinâmica","q":"Qual a unidade de força no SI?","a":"Newton","r":"Força se mede em newtons (N): 1 N = 1 kg·m/s².","o":["Joule","Watt","Newton","Pascal"],"c":2},{"id":"d4","s":"Física","t":"Eletricidade","q":"Um resistor de 10 Ω é atravessado por 2 A. Qual a tensão?","a":"20 V","r":"1ª Lei de Ohm: U = R·i = 10·2 = 20 V.","o":["5 V","12 V","20 V","0,2 V"],"c":2},{"id":"d5","s":"Química","t":"Atomística","q":"O que define o número atômico (Z)?","a":"O número de prótons no núcleo.","r":"O número atômico identifica o elemento químico: é a quantidade de prótons do núcleo."},{"id":"d6","s":"Química","t":"Ligações Químicas","q":"Qual ligação ocorre entre Na e Cl no NaCl?","a":"Iônica","r":"Entre metal e ametal há transferência de elétrons: formam-se íons que se atraem (ligação iônica).","o":["Covalente","Iônica","Metálica","Van der Waals"],"c":1},{"id":"d7","s":"Matemática","t":"Função Afim","q":"Qual o coeficiente angular de f(x) = 3x + 5?","a":"3","r":"Em f(x) = ax + b, 'a' é o coeficiente angular (inclinação da reta) e 'b' o coeficiente linear.","o":["5","3","8","−3"],"c":1},{"id":"d8","s":"Matemática","t":"Probabilidade","q":"Qual a probabilidade de tirar face 6 em um dado justo?","a":"1/6","r":"Probabilidade = casos favoráveis ÷ casos possíveis = 1/6.","o":["1/2","1/3","1/6","1/12"],"c":2},{"id":"d9","s":"Matemática","t":"Geometria Plana","q":"Qual a área de um círculo de raio r?","a":"A = π·r²","r":"A área do círculo é π vezes o quadrado do raio."},{"id":"d10","s":"Português","t":"Figuras de Linguagem","q":"'Ele é uma raposa nos negócios' é exemplo de:","a":"Metáfora","r":"Metáfora compara elementos sem usar 'como', atribuindo a um as qualidades do outro.","o":["Metáfora","Hipérbole","Ironia","Eufemismo"],"c":0},{"id":"d11","s":"Inglês","t":"Verb Tenses","q":"Choose the correct form: 'She ___ to school yesterday.'","a":"went","r":"'Yesterday' indica passado simples: go → went.","o":["go","goes","went","gone"],"c":2},{"id":"d12","s":"Biologia","t":"Citologia","q":"Qual organela realiza a respiração celular?","a":"Mitocôndria","r":"As mitocôndrias produzem ATP na respiração celular aeróbica.","o":["Ribossomo","Mitocôndria","Lisossomo","Complexo de Golgi"],"c":1},{"id":"d13","s":"História","t":"Era Vargas","q":"Qual regime foi instaurado por Vargas em 1937?","a":"Estado Novo","r":"Em 1937 Vargas deu um golpe e implantou o Estado Novo, ditadura que durou até 1945.","o":["Império","Estado Novo","República Velha","Regência"],"c":1},{"id":"d14","s":"Geografia","t":"Climatologia","q":"Qual o clima predominante na Amazônia?","a":"Equatorial","r":"Clima equatorial: quente e úmido o ano todo, com chuvas abundantes.","o":["Semiárido","Equatorial","Subtropical","Temperado"],"c":1},{"id":"n1790721233154","s":"Português","t":"Interpretação de Texto","q":"[TEXTO 1}\n\nDo século 11 até o início do século 19, um rito de cura era realizado pelos reis da França e da Inglaterra. Eles eram considerados como tendo um poder divino, hereditário, de curar com as próprias mãos a escrófula, uma linfadenite tuberculosa que afeta principalmente os nódulos linfáticos cervicais. O rito acontecia regularmente com grupos de pacientes que se preparavam para essa cerimônia. A crença nesse poder milagroso baseava-se no fato de os reis terem sido ungidos e coroados em cerimônia religiosa, adquirindo assim uma natureza sacerdotal. Talvez seja umas das fake news mais duradouras da história.\n\nAinda que durem menos tempo, a quantidade de promessas e encantos que proliferam em redes sociais é avassaladora na pandemia do coronavírus. Quando o esforço deveria ser por uma batalha lado a lado, contra a doença, gasta-se energia na guerra da contrainformação. Desnudou-se fanatismo de todos os lados.\n\nCabe, portanto, responsabilidade e maturidade para entender o que ocorre. O método científico não é uma bandeira ideológica, mas uma técnica consistente de testar hipóteses e chegar em verdades. Avanços médicos, mesmo com necessidade de celeridade, devem ser cuidadosos e reproduzíveis. Soluções muito simplificadas e temperadas por teorias conspiratórias devem ser vistas com muito cuidado.\n\nAo mesmo tempo, deve haver sensibilidade para calibrar o entendimento de riscos reais, para não trocar uma doença por outra. Atrasar revisões médicas e não sair de casa nem para doar sangue não protege, nem as pessoas e nem o sistema de saúde!\n\nMas temos boas notícias. A humanidade tem se esforçado para buscar respostas de forma inédita. A investigação de dezenas de remédios e vacinas está em franco progresso. Enquanto isso, continua sendo importante lavar as mãos. Só que não existe solução simples, como uma cura pelo toque do rei.\n\nA propósito, as pessoas ficavam curadas, o que alimentava as suas crenças, porque lavavam suas chagas para que o rei as tocasse. Não era o rei... eram a água e o sabão.\n\n--------\nA partir da leitura da crônica (Texto 1), avalie as afirmações e selecione aquela que melhor expressa a crítica do autor às crenças em soluções milagrosas para problemas de saúde.","a":"B. A aparente eficácia de certas práticas curativas frequentemente resulta de fatores secundários cientificamente válidos, mas que são ignorados pelos crentes, perpetuando a falsa atribuição de resultados positivos a elementos místicos","r":"O texto critica a crença em curas milagrosas mostrando que o resultado aparentemente sobrenatural pode ter uma explicação concreta e científica. No caso dos reis, as pessoas realmente melhoravam, mas não por causa do “poder de cura” do rei: elas lavavam as feridas antes do contato, e eram a água e o sabão que ajudavam na recuperação. Assim, o erro estava em atribuir o resultado a uma causa mística, ignorando o verdadeiro fator responsável.\n\nPor que as outras estão erradas?\n\nA: afirma que as curas milagrosas apresentam resultados reais por causa do próprio tratamento, o que o texto não defende.\nC: contradiz diretamente o texto, que afirma que o método científico é essencial, inclusive em situações de crise.\nD: também contraria o autor, que questiona justamente a atribuição de efeitos terapêuticos à fé ou ao sobrenatural.\n\nMacete para a prova: procure no final do texto a explicação do autor: “Não era o rei... eram a água e o sabão.” Essa frase resume a crítica central: um resultado real não significa que a explicação dada para ele seja verdadeira.","o":["A. Crenças em “curas milagrosas” persistem ao longo da história porque esses tratamentos apresentam resultados reais, ainda que parciais, daí a necessidade de investigar cientificamente todas as práticas tradicionais antes de descartá-las como ineficazes.","B. A aparente eficácia de certas práticas curativas frequentemente resulta de fatores secundários cientificamente válidos, mas que são ignorados pelos crentes, perpetuando a falsa atribuição de resultados positivos a elementos místicos","C. O método científico deve ser relativizado em contextos de crise sanitária, pois a história demonstra que práticas empíricas simples, mesmo quando baseadas em crenças populares, podem ser eficazes.","D. A longevidade de crenças em poderes curativos sobrenaturais evidencia que a fé desempenha um papel terapêutico legítimo, razão pela qual tais crenças não devem ser completamente substituídas pelo racionalismo científico."],"c":1},{"id":"n1790721636745","s":"Português","t":"Interpretação de Texto","q":"{TEXTO}\n\nDo século 11 até o início do século 19, um rito de cura era realizado pelos reis da França e da Inglaterra. Eles eram considerados como tendo um poder divino, hereditário, de curar com as próprias mãos a escrófula, uma linfadenite tuberculosa que afeta principalmente os nódulos linfáticos cervicais. O rito acontecia regularmente com grupos de pacientes que se preparavam para essa cerimônia. A crença nesse poder milagroso baseava-se no fato de os reis terem sido ungidos e coroados em cerimônia religiosa, adquirindo assim uma natureza sacerdotal. Talvez seja umas das fake news mais duradouras da história.\n\nAinda que durem menos tempo, a quantidade de promessas e encantos que proliferam em redes sociais é avassaladora na pandemia do coronavírus. Quando o esforço deveria ser por uma batalha lado a lado, contra a doença, gasta-se energia na guerra da contrainformação. Desnudou-se fanatismo de todos os lados.\n\nCabe, portanto, responsabilidade e maturidade para entender o que ocorre. O método científico não é uma bandeira ideológica, mas uma técnica consistente de testar hipóteses e chegar em verdades. Avanços médicos, mesmo com necessidade de celeridade, devem ser cuidadosos e reproduzíveis. Soluções muito simplificadas e temperadas por teorias conspiratórias devem ser vistas com muito cuidado.\n\nAo mesmo tempo, deve haver sensibilidade para calibrar o entendimento de riscos reais, para não trocar uma doença por outra. Atrasar revisões médicas e não sair de casa nem para doar sangue não protege, nem as pessoas e nem o sistema de saúde!\n\nMas temos boas notícias. A humanidade tem se esforçado para buscar respostas de forma inédita. A investigação de dezenas de remédios e vacinas está em franco progresso. Enquanto isso, continua sendo importante lavar as mãos. Só que não existe solução simples, como uma cura pelo toque do rei. ------------------ Analise as afirmações a seguir e selecione aquela que identifica CORRETAMENTE a estratégia composicional\npredominante no texto 1.","a":"O cronista emprega uma estrutura circular: episódio histórico → argumentação contemporânea → retomada do exemplo inicial. O final ressignifica a narrativa histórica, enquanto reafirma a crítica ao presente.","r":"Resumo comentado da resolução:\nO texto apresenta uma estrutura circular: começa contando o episódio histórico da “cura pelo toque do rei”, depois relaciona essa crença com as promessas e curas milagrosas durante a pandemia e, no final, retoma o caso dos reis para revelar a verdadeira explicação das supostas curas: “eram a água e o sabão”.\n\nAssim, o final volta ao exemplo apresentado no início, mas agora com um novo significado. Essa retomada reforça a crítica do autor às explicações milagrosas e à falta de análise científica.\n\nMacete: quando um texto começa com um exemplo, desenvolve uma discussão e termina retomando aquele mesmo exemplo, pense em estrutura circular.","o":["O autor adota estrutura tese-antítese-síntese: valorização inicial de práticas tradicionais → contraposição pela defesa do método científico → síntese equilibrada sobre ambas perspectivas.","O texto utiliza uma progressão linear cronológica: parte da evolução histórica para demonstrar como as sociedades gradualmente superaram crenças irracionais por meio do desenvolvimento do pensamento científico.","A crônica organiza-se por contraposição entre dois blocos independentes: de um lado o relato histórico, de outro a análise da pandemia. A justaposição permite que o leitor extraia suas próprias conclusões de ambos eventos.","O cronista emprega uma estrutura circular: episódio histórico → argumentação contemporânea → retomada do exemplo inicial. O final ressignifica a narrativa histórica, enquanto reafirma a crítica ao presente."],"c":3},{"id":"n1790721806680","s":"Matemática","t":"Funções","q":"Tumores malignos, popularmente conhecidos como câncer, são caracterizados pelo crescimento desordenado\ne agressivo de células anormais. Diferente dos tumores benignos, essas células têm a capacidade de invadir\ntecidos e órgãos vizinhos, além de se espalharem para outras partes do corpo por meio da corrente sanguínea\nou do sistema linfático, processo denominado metástase.\nEm um caso clínico, o volume, 𝑉(𝑡), de um tipo específico de tumor, em 𝑐𝑚ଷ\n, foi modelado em função do tempo\n𝑡, em meses, pela função\n𝑉(𝑡) = 𝑎 ∙ ln (𝑡 + 1)\nonde 𝑎 ∈ ℝ.\nSabe-se que, com 𝑡 = 7 𝑚𝑒𝑠𝑒𝑠, o volume do tumor era de 8,32 𝑐𝑚ଷ\n.\nDetermine o volume, em 𝑐𝑚ଷ\n, do tumor no instante 𝑡 = 51 𝑑𝑖𝑎𝑠.\nConsidere 1 𝑚ê𝑠 = 30 𝑑𝑖𝑎𝑠, ln(8) = 2,08 e 𝑒 = 2,7.","a":"4 cm³","r":"","o":["3 cm³","4 cm³","4,8 cm³","5,1 cm³"],"c":1},{"id":"n1790722104201","s":"Matemática","t":"Geometria Analítica","q":"Seja o triângulo 𝐴𝐵𝐶 com 𝐴(5,10), 𝐵(11,4) e 𝐶(9,2).\nDetermine a área do círculo circunscrito ao triângulo 𝐴𝐵𝐶.","a":"20π unidades de área","r":"","o":["10π unidades de área","15π unidades de área","16π unidades de área","20π unidades de área"],"c":3},{"id":"n1790722292056","s":"Física","t":"Eletricidade","q":"Enquanto você lê esta questão e organiza o raciocínio para resolvê-la, bilhões de neurônios no seu sistema\nnervoso estão ativos. Cada pensamento, cada decisão e cada cálculo realizado durante a prova envolve a\npropagação de sinais elétricos ao longo de neurônios, fenômeno conhecido como potencial de ação. Esses\nsinais dependem do deslocamento ordenado de íons através da membrana neuronal, como o ion Na⁺, cuja\nmovimentação altera a energia do sistema e sustenta processos essenciais como percepção, memória e\nmovimento voluntário. Embora o funcionamento real de um neurônio seja biologicamente complexo, modelos\nfísicos simplificados permitem compreender aspectos essenciais desse mecanismo.\nConsidere um modelo no qual um íon Na⁺ atravessa uma região da membrana celular onde existe um\ncampo elétrico supostamente uniforme, que realiza trabalho sobre a carga ao longo de uma trajetória retilínea.\n50\nDurante a travessia, o íon sofre um aumento de energia (de natureza mecânica) em 4,8 x 10−21 J ao\npercorrer uma distância de 2,0 nm no sentido do campo. Despreze colisões, efeitos dissipativos e quaisquer\noutras forças além da força elétrica.\nAssinale a alternativa que apresenta o módulo do campo elétrico uniforme nessa região da membrana.","a":"1,5 × 107  V/m","r":"","o":["1,5 × 107  V/m","1,5 × 106  V/m","3,0 × 108  V/m","3,0 × 107  V/m"],"c":0},{"id":"n1790722600145","s":"Química","t":"Tabela Periódica","q":"Um grupo de 17 elementos químicos tem chamado cada vez mais a atenção do mundo: as Terras Raras. Esse\ngrupo é composto, principalmente, pelos lantanídeos, e são de grande importância estratégica, comercial e\npolítica, pois são bastante reativos, quando comparados com outros metais. Elementos como o Neodímio, o\nPraseodímio e o Gadolínio são utilizados, por exemplo, na fabricação de componentes eletrônicos presentes\nem smartphones e carros elétricos, ímãs de alta potência e até mesmo tecnologias militares. O Brasil possui a\nsegunda maior reserva natural de elementos de Terras Raras do mundo, com cerca de 21 milhões de toneladas,\natrás apenas da China.\nSobre as propriedades químicas e físicas dos elementos de Terras Raras, assinale a alternativa CORRETA","a":"Os elétrons de diferenciação dos elementos de Terras Raras, em sua maioria, estão no subnível 4f, que possui baixa participação em ligações químicas.","r":"a). Incorreta. Embora sejam chamados de “Terras Raras”, estes elementos são abundantes na crosta terrestre. O problema é que\neles não são encontrados de formas economicamente viáveis e de fácil mineração, pois estão presentes em baixa concentração,\nespalhados por uma área muito grande.\nb) Incorreta. Estes elementos são todos metais de grandes raios atômicos.\nc) Incorreta. Por serem muito reativos, estes elementos são encontrados em formas de óxidos, fosfatos, entre outros compostos.\nd) Correta","o":["Embora seja de fácil mineração, estes elementos são bastante escassos na natureza especialmente quando comparados com outros metais mais comuns, como a prata ou o cádmio","A alta reatividade destes elementos é devida aos seus raios atômicos, que são pequenos quando comparados com os de outros metais.","Os elementos de terras raras são encontrados na natureza normalmente em sua forma metálica.","Os elétrons de diferenciação dos elementos de Terras Raras, em sua maioria, estão no subnível 4f, que possui baixa participação em ligações químicas."],"c":3},{"id":"n1790722738552","s":"Química","t":"Ácidos e Bases","q":"O ácido fórmico é um ácido orgânico de baixa massa molecular, e é um contaminante comum em efluentes\nindustriais, especialmente de setores têxteis. Ele pode ser neutralizado com o uso de óxido de zinco, segundo\na reação química equacionada a seguir:\nZnO + 2 HCOOH → Zn(HCOO)2 + H2O\nSobre esta reação e as substâncias nela envolvidas, assinale a alternativa CORRETA.","a":"O óxido de zinco é um óxido anfótero, apresentando comportamento alcalino na presença do ácido fórmico.","r":"a) Incorreta. Sais de ácidos carboxílicos curtos, como os acetatos e formiatos, são bastante solúveis em água.\nb) Incorreta. O sal formado tem caráter levemente ácido e pode sofrer hidrólise, portanto o pH não será necessariamente neutro.\nc) Correta. Óxidos anfóteros, como os de zinco ou de alumínio, tem comportamento ácido ou básico a depender da presença de\noutros reagentes. Nesse caso, como o outro reagente é um ácido, o óxido de zinco se comporta como base.\nd) Incorreta. Apesar de ser uma neutralização, o óxido de zinco não é uma base de Arrhenius, afinal ele é um óxido","o":["O sal formado, o formiato de zinco, é um sal pouco solúvel em água, e irá precipitar ao fim desta reação.","O pH da solução final é necessariamente igual a 7,0, afinal o ácido foi neutralizado, e foi formada a água.","O óxido de zinco é um óxido anfótero, apresentando comportamento alcalino na presença do ácido fórmico.","Esta é uma reação de neutralização, afinal os reagentes são um ácido e uma base de Arrhenius."],"c":2},{"id":"n1790722850578","s":"Biologia","t":"Histologia Vegetal","q":"Em diferentes regiões de Santa Catarina, a vegetação está submetida a condições ambientais bastante\ndistintas. Enquanto áreas de restinga e manguezal, no litoral, enfrentam elevada salinidade, ventos intensos e\nforte insolação; formações vegetais do interior convivem com variações térmicas marcantes e solos de\ncaracterísticas diversas. Essas condições selecionam estruturas e tecidos vegetais capazes de garantir\nproteção, sustentação, transporte e crescimento, caracterizando os diferentes tipos de vegetações de nosso\nestado.\nConsiderando a organização histológica dos vegetais e sua relação com a adaptação ao ambiente, assinale a\nalternativa CORRETA.","a":"A epiderme vegetal, revestida em muitas espécies por cutícula, exerce papel de proteção, podendo reduzir a perda de água; já os tecidos vasculares realizam o transporte de substâncias pelo corpo da planta.","r":"A alternativa correta descreve adequadamente a função protetora da epiderme com cutícula (reduzindo a perda de água) e a\nfunção de transporte dos tecidos vasculares (xilema e floema). A alternativa que trata os meristemas apicais como tecidos\npermanentes especializados em fotossíntese está incorreta, pois os meristemas apicais são tecidos de crescimento, formados\npor células indiferenciadas, responsáveis por originar novos tecidos vegetais e não constituem tecido fotossintetizante\nespecializado.\nA alternativa que afirma que parênquima aquífero e colênquima são tecidos meristemáticos secundários, ligados à condução de\nágua e à formação de novos órgãos, está incorreta porque esses tecidos não são meristemas. O parênquima aquífero atua\nprincipalmente no armazenamento de água, enquanto o colênquima exerce função de sustentação em regiões jovens da planta\ne são tecidos adultos.\nA alternativa que apresenta o esclerênquima como tecido de células indiferenciadas, mitoticamente ativas, responsável pelo\ncrescimento primário está incorreta porque o esclerênquima é um tecido de sustentação, geralmente composto por células\nmaduras com paredes espessas, e não por células embrionárias, responsáveis pelo crescimento.","o":["O parênquima aquífero e o colênquima são tecidos meristemáticos secundários, responsáveis, respectivamente, pela condução de água e pela produção de novos órgãos vegetativos.","Os meristemas apicais são tecidos permanentes especializados na fotossíntese e se localizam, principalmente, no interior das folhas jovens.","A epiderme vegetal, revestida em muitas espécies por cutícula, exerce papel de proteção, podendo reduzir a perda de água; já os tecidos vasculares realizam o transporte de substâncias pelo corpo da planta.","O esclerênquima é um tecido formado por células indiferenciadas, com alta atividade mitótica, responsável pelo crescimento primário de caules e raízes."],"c":2},{"id":"n1790722940373","s":"Biologia","t":"Fisiologia Humana","q":"Em campanhas de prevenção de fraturas em idosos, é comum destacar que a perda de massa óssea não\nresulta apenas da redução na ingestão de cálcio, mas também de alterações hormonais capazes de modificar\na atividade relativa de osteoblastos e osteoclastos. Em mulheres, após a menopausa, esse desequilíbrio pode\ntornar a reabsorção óssea mais intensa que a formação de novo tecido, aumentando a fragilidade do esqueleto\nao longo do envelhecimento.\nConsiderando os mecanismos biológicos envolvidos nesse processo, assinale a alternativa CORRETA.","a":"A redução do estrogênio após a menopausa favorece maior reabsorção óssea, pois diminui o controle sobre a atividade dos osteoclastos, contribuindo para a perda de densidade mineral e para o aumento da fragilidade esquelética.","r":"A alternativa correta indica que o estrogênio contribui para modular a atividade e a longevidade dos osteoclastos. Sua redução\napós a menopausa favorece o aumento da reabsorção óssea em relação à formação de novo tecido, resultando em perda de\ndensidade mineral e maior risco de fraturas.\nA alternativa que apresenta a progesterona como principal responsável pela osteoporose e afirma que ela estimula osteoclastos\na incorporar cálcio à matriz óssea está incorreta porque osteoclastos não incorporam cálcio ao tecido ósseo; eles atuam na\nreabsorção óssea. Além disso, o hormônio mais diretamente relacionado a esse contexto é o estrogênio.\nA alternativa que sustenta que a queda de estrogênio e progesterona interrompe a remodelação óssea, bloqueando osteoblastos\ne osteoclastos, está incorreta porque a remodelação não é interrompida. O que ocorre é um desequilíbrio entre formação e\nreabsorção óssea, com aumento relativo da perda mineral.\nA alternativa que atribui à progesterona papel mais decisivo que o estrogênio na densidade óssea e ainda fala em “ação\nreabsortiva dos osteoblastos” está incorreta porque osteoblastos não realizam reabsorção; essa função cabe aos osteoclastos.\nAlém disso, nesse contexto, a queda do estrogênio é o fator hormonal central associado ao aumento do risco de osteoporose\napós a menopausa.","o":["A redução da progesterona, após a menopausa, é o principal fator responsável pela osteoporose, pois esse hormônio estimula diretamente os osteoclastos a incorporar cálcio à matriz óssea e a elevar a resistência mecânica dos ossos.","A redução do estrogênio após a menopausa favorece maior reabsorção óssea, pois diminui o controle sobre a atividade dos osteoclastos, contribuindo para a perda de densidade mineral e para o aumento da fragilidade esquelética.","A queda do estrogênio e da progesterona provoca interrupção da remodelação óssea, uma vez que ambos os hormônios bloqueiam a atividade de osteoblastos e osteoclastos, mantendo o tecido ósseo sem renovação ao longo do envelhecimento.","A diminuição da progesterona tem impacto mais decisivo que a do estrogênio sobre a densidade óssea, porque esse hormônio regula diretamente a fixação de sais minerais no esqueleto e impede a ação reabsortiva dos osteoblastos."],"c":1},{"id":"n1790725095947","s":"Português","t":"Interpretação de Texto","q":"[TEXTO 1} Do século 11 até o início do século 19, um rito de cura era realizado pelos reis da França e da Inglaterra. Eles eram considerados como tendo um poder divino, hereditário, de curar com as próprias mãos a escrófula, uma linfadenite tuberculosa que afeta principalmente os nódulos linfáticos cervicais. O rito acontecia regularmente com grupos de pacientes que se preparavam para essa cerimônia. A crença nesse poder milagroso baseava-se no fato de os reis terem sido ungidos e coroados em cerimônia religiosa, adquirindo assim uma natureza sacerdotal. Talvez seja umas das fake news mais duradouras da história. Ainda que durem menos tempo, a quantidade de promessas e encantos que proliferam em redes sociais é avassaladora na pandemia do coronavírus. Quando o esforço deveria ser por uma batalha lado a lado, contra a doença, gasta-se energia na guerra da contrainformação. Desnudou-se fanatismo de todos os lados. Cabe, portanto, responsabilidade e maturidade para entender o que ocorre. O método científico não é uma bandeira ideológica, mas uma técnica consistente de testar hipóteses e chegar em verdades. Avanços médicos, mesmo com necessidade de celeridade, devem ser cuidadosos e reproduzíveis. Soluções muito simplificadas e temperadas por teorias conspiratórias devem ser vistas com muito cuidado. Ao mesmo tempo, deve haver sensibilidade para calibrar o entendimento de riscos reais, para não trocar uma doença por outra. Atrasar revisões médicas e não sair de casa nem para doar sangue não protege, nem as pessoas e nem o sistema de saúde! Mas temos boas notícias. A humanidade tem se esforçado para buscar respostas de forma inédita. A investigação de dezenas de remédios e vacinas está em franco progresso. Enquanto isso, continua sendo importante lavar as mãos. Só que não existe solução simples, como uma cura pelo toque do rei. A propósito, as pessoas ficavam curadas, o que alimentava as suas crenças, porque lavavam suas chagas para que o rei as tocasse. Não era o rei... eram a água e o sabão. -------- Assinale a alternativa que melhor descreve a função do episódio histórico no texto 1.","a":"O evento histórico funciona como uma analogia, permitindo ao autor criar um distanciamento crítico para analisar um problema contemporâneo. A revelação final reforça a tese principal de forma irônica, uma abordagem comum ao gênero crônica.","r":"INCORRETA: O relato sobre o rito medieval serve principalmente como um exórdio, uma curiosidade histórica para atrair o leitor,\ncom subsequente deslocamento do foco para a argumentação sobre a pandemia, que constitui o verdadeiro núcleo temático da\ncrônica.\nA afirmativa descreve que no texto o episódio seria uma curiosidade sem muita relevância para o argumento central do texto. No\ntexto, o exemplo histórico não é abandonado; ele é retomado e ressignificado no final, servindo de estrutura argumentativa.\nCORRETA: O evento histórico funciona como uma analogia, permitindo ao autor criar um distanciamento crítico para analisar um\nproblema contemporâneo. A revelação final reforça a tese principal de forma irônica, uma abordagem comum ao gênero crônica.\nEsta afirmativa representa com precisão o papel do episódio histórico no texto. A analogia é uma figura de linguagem usada para\nestabelecer uma comparação entre duas coisas distintas, mas que apresentam lógicas semelhantes, no caso, as crenças em\ncuras milagrosas no passado e a aceitação de “promessas e encantos” nos tempos atuais. Essa analogia cria distância crítica e\nconduz à reflexão sobre a contemporaneidade; a revelação final (“Não era o rei... eram a água e o sabão”) funciona como ironia\nque reforça o ponto de vista do autor, recurso típico da crônica.\nINCORRETA: O autor utiliza o fato histórico com uma finalidade didática e expositiva, objetivando informar o leitor sobre um\nepisódio pouco conhecido da história e, a partir dele, extrair uma lição de moral sobre a importância da ciência.\nO objetivo do texto não é informar ou ensinar. Esta alternativa está incorreta por tratar o fato histórico como forma de lição didáticoexpositiva, sendo que a função central não é referencial ou informativa, mas sim de convencimento (função conativa). A crônica\nusa o episódio como analogia e ironia, com efeito retórico.\nINCORRETA: A crônica estabelece uma relação de contraste nostálgico, no qual a ingenuidade da crença medieval, embora\nequivocada, é apresentada com certa benevolência em oposição à natureza maliciosa da desinformação contemporânea.\nNo texto, o autor critica tanto a crença medieval quanto suas reencenações modernas. Portanto, não há nostalgia benevolente\nquanto às práticas de tratamentos não embasados em ciência. A crônica usa do paralelo com a história para tecer uma crítica\nque evidencia continuidade do erro.","o":["O relato sobre o rito medieval serve, principalmente, como um exórdio, uma curiosidade histórica para atrair o leitor, com subsequente deslocamento do foco para a argumentação sobre a pandemia, que constitui o verdadeiro núcleo temático da crônica.","O evento histórico funciona como uma analogia, permitindo ao autor criar um distanciamento crítico para analisar um problema contemporâneo. A revelação final reforça a tese principal de forma irônica, uma abordagem comum ao gênero crônica.","O autor utiliza o fato histórico com uma finalidade didática e expositiva, objetivando informar o leitor sobre um episódio pouco conhecido da história e, a partir dele, extrair uma lição de moral sobre a importância da ciência.","A crônica estabelece uma relação de contraste nostálgico, no qual a ingenuidade da crença medieval, embora equivocada, é apresentada com certa benevolência em oposição à natureza maliciosa da desinformação contemporânea."],"c":1},{"id":"n1790725203493","s":"Português","t":"Interpretação de Texto","q":"[TEXTO 1} Do século 11 até o início do século 19, um rito de cura era realizado pelos reis da França e da Inglaterra. Eles eram considerados como tendo um poder divino, hereditário, de curar com as próprias mãos a escrófula, uma linfadenite tuberculosa que afeta principalmente os nódulos linfáticos cervicais. O rito acontecia regularmente com grupos de pacientes que se preparavam para essa cerimônia. A crença nesse poder milagroso baseava-se no fato de os reis terem sido ungidos e coroados em cerimônia religiosa, adquirindo assim uma natureza sacerdotal. Talvez seja umas das fake news mais duradouras da história. Ainda que durem menos tempo, a quantidade de promessas e encantos que proliferam em redes sociais é avassaladora na pandemia do coronavírus. Quando o esforço deveria ser por uma batalha lado a lado, contra a doença, gasta-se energia na guerra da contrainformação. Desnudou-se fanatismo de todos os lados. Cabe, portanto, responsabilidade e maturidade para entender o que ocorre. O método científico não é uma bandeira ideológica, mas uma técnica consistente de testar hipóteses e chegar em verdades. Avanços médicos, mesmo com necessidade de celeridade, devem ser cuidadosos e reproduzíveis. Soluções muito simplificadas e temperadas por teorias conspiratórias devem ser vistas com muito cuidado. Ao mesmo tempo, deve haver sensibilidade para calibrar o entendimento de riscos reais, para não trocar uma doença por outra. Atrasar revisões médicas e não sair de casa nem para doar sangue não protege, nem as pessoas e nem o sistema de saúde! Mas temos boas notícias. A humanidade tem se esforçado para buscar respostas de forma inédita. A investigação de dezenas de remédios e vacinas está em franco progresso. Enquanto isso, continua sendo importante lavar as mãos. Só que não existe solução simples, como uma cura pelo toque do rei. A propósito, as pessoas ficavam curadas, o que alimentava as suas crenças, porque lavavam suas chagas para que o rei as tocasse. Não era o rei... eram a água e o sabão.  --------------------\n\nA que o autor refere-se quando usa o termo “fake news” (linha 5) no texto 1?\nAssinale a alternativa CORRETA.","a":"À crença de que os reis possuíam um poder divino e hereditário, transmitido por meio de rituais religiosos, que lhes permitia curar doenças com o simples toque.","r":"INCORRETA: Ao fato de que as pessoas ficavam curadas após o ritual, o que mascarava a verdadeira causa da melhora e,\nconsequentemente, validava o poder real perante os súditos.\nEsta alternativa confunde o efeito (cura real) com a informação falsa (a causa da cura). A cura era real, mas sua causa era\natribuída equivocadamente ao toque do rei, logo, o fato de as pessoas ficarem curadas não é a \"fake news\". A \"fake news\" é a\nexplicação falsa para essa cura.\nINCORRETA: C. Ao ritual de unção e coroação em si, o qual conferia uma natureza sacerdotal aos reis e era a principal\njustificativa para os supostos poderes milagrosos dos monarcas.\nNesta afirmação, atribui-se ao ritual a O ritual de unção e coroação era o mecanismo que, segundo a crença, conferia o poder ao\nrei. O ritual em si é um fato histórico; a \"fake news\" é a crença de que esse ritual realmente concedia poderes de cura.\nCORRETA: À crença de que os reis possuíam um poder divino e hereditário, transmitido por meio de rituais religiosos, que lhes\npermitia curar doenças com o simples toque.\nA alternativa aponta para o núcleo da desinformação descrita: a crença em si na cura pelo ritual. A \"fake news\" durou do “século\n11 até o início do século 19”, tratava-se da ideia de que os reis tinham um poder de cura divino. O texto descreve essa crença\n(\"eles eram considerados como tendo um poder divino, hereditário, de curar.\nINCORRETA: Às narrativas deliberadamente fabricadas e disseminadas pelas cortes reais para consolidar o poder político,\nutilizando a cura como uma forma de propaganda monárquica.\nA crença popular na cura real pode, historicamente, ter sido instrumentalizada politicamente, porém a crônica não aborda estes\naspectos políticos. No texto o autor apresenta a crença na cura pelo ritual como um erro coletivo e não como como uma campanha\nde desinformação ativamente fabricada pela corte, sendo esta uma ideia que extrapola o sentido do texto.","o":["Ao ritual de unção e coroação em si, o qual conferia uma natureza sacerdotal aos reis e era a principal justificativa para os supostos poderes milagrosos dos monarcas.","Ao fato de que as pessoas ficavam curadas após o ritual, o que mascarava a verdadeira causa da melhora e, consequentemente, validava o poder real perante os súditos.","À crença de que os reis possuíam um poder divino e hereditário, transmitido por meio de rituais religiosos, que lhes permitia curar doenças com o simples toque.","Às narrativas deliberadamente fabricadas e disseminadas pelas cortes reais para consolidar o poder político, utilizando a cura como uma forma de propaganda monárquica."],"c":2},{"id":"n1790725325850","s":"Português","t":"Interpretação de Texto","q":"“Quando o esforço deveria ser por uma batalha lado a lado, contra a doença, gasta-se energia na guerra da\ncontrainformação. Desnudou-se fanatismo de todos os lados.”. Neste trecho, a voz passiva\nsintética cumpre uma função textual-discursiva específica.\nAssinale a alternativa que descreve, CORRETAMENTE, o principal efeito obtido pelo autor com o emprego\ndesse recurso.","a":"Omitir um agente que é generalizado ou indefinido, deslocando o foco da responsabilidade individual para a constatação de um processo ou fenômeno coletivo","r":"INCORRETA: Conferir um tom de objetividade científica e imparcialidade ao texto, distanciando a opinião do autor dos fatos\nnarrados.\nA voz passiva é frequentemente associada à objetividade em textos científicos. No entanto, o contexto deste trecho é a crônica,\nque apresenta conteúdo opinativo e crítico. Portanto, o recurso não é usado para criar imparcialidade ou um distanciamento\ntécnico, mas sim para veicular uma crítica social generalizada.\nINCORRETA: Enfatizar \"energia\" e o \"fanatismo\", tratando-os como os elementos mais importantes da frase, a fim de transmitir\na ideia de descontentamento em face da situação atual.\nA voz passiva analítica é a forma que funciona melhor com a função de destacar o sujeito paciente (energia é gasta, fanatismo\nfoi desnudado), pois esses elementos ganham topicalidade e prominência na estrutura da frase. Na formulação sintética\napresentada no texto, essa ênfase não ocorre. No texto, a omissão do agente é que cumpre a função primordial de caracterizar\nas ações como um processo coletivo e impessoal. Além disso, \"a ideia de descontentamento\" não deriva do uso da voz passiva,\nmas sim das escolhas lexicais (esforço, batalha, gastar, desnudar) que no texto se encadeiam através de a associações negativas\npor conta da crítica realizada.\nCORRETA: Omitir um agente que é generalizado ou indefinido, deslocando o foco da responsabilidade individual para a\nconstatação de um processo ou fenômeno coletivo.\nO agente das ações de \"gastar energia\" e \"desnudar o fanatismo\" não é um indivíduo específico, mas um agente coletivo e\nindefinido (a sociedade, as pessoas em geral). Ao usar a voz passiva, o autor evita apontar uma culpa individual e leva à\nconstatação de um processo que ocorre em larga escala.\nINCORRETA: Ocultar deliberadamente a identidade de um agente específico e conhecido, com a intenção de proteger esse\nagente de responsabilidade.\nEsta alternativa descreve uma função possível da voz passiva (a ocultação de um agente conhecido), mas que não se aplica a\neste contexto. O autor não está escondendo um culpado específico, pois esse agente não é \"conhecido\" e ocultado; ele é, por\nsua natureza, difuso e indefinido.","o":["Enfatizar \"energia\" e \"fanatismo\", tratando-os como os elementos mais importantes da frase, a fim de transmitir a ideia de descontentamento em face da situação atual.","Conferir um tom de objetividade científica e imparcialidade ao texto, distanciando a opinião do autor dos fatos narrados.","Omitir um agente que é generalizado ou indefinido, deslocando o foco da responsabilidade individual para a constatação de um processo ou fenômeno coletivo","Ocultar deliberadamente a identidade de um agente específico e conhecido, com a intenção de proteger esse agente de responsabilidade."],"c":2},{"id":"n1790725476018","s":"Português","t":"Interpretação de Texto","q":"{TEXTO 1}\nMusicoterapia para depressão pode melhorar o\nhumor\n| 10 dez 2014 | ID: poems-80\nQuestão Clínica: Qual é a eficácia da musicoterapia\npara a depressão?\nResposta Baseada em Evidência: Comparado com o\ntratamento padrão, a musicoterapia foi aceita por\npessoas com depressão, e associada com melhora no\nhumor em quatro dos cinco estudos revisados.\nAlertas: O número reduzido e baixa qualidade\nmetodológica dos estudos sugerem que não é possível\nter certeza sobre a eficácia da musicoterapia. Grandes\nvariações nas intervenções oferecidas, populações\nestudadas e avaliações dos desfechos adotados\nsignificam que a síntese de dados quantitativos e metaanálise não foram adequadas. \n\n{TEXTO 2}\nCantá sintino sodade\nQui dexa as marca di verga\nDi arguém qui os óio num vê\nI o coração inda inxerga\n(...)\nCantá cum muitos amigos\nQui a vida canta mió\nÉ im bando qui os passarim\nCantano disperta o só\nCantá, cantá sempri mais:\nDi tardi, di noiti i di dia\nCantá, cantá qui a paiz\nCarece de mais cantoria\nCantá seja lá cumu fô\nSi a dô fô mais grandi qui o peito,\nCantá bem mais forti qui a dô \n\nOs textos 2 e 3 abordam o tema da música e seus efeitos. Considerando as características linguísticas e as\nfunções sociais de cada registro,\nanalise as proposições e coloque (V) para verdadeira e (F) para falsa.\n( ) No texto 3, a representação gráfica da fonética é um recurso estilístico que valoriza uma variedade\nlinguística socialmente estigmatizada como forma de expressão poética e de sabedoria popular.\n( ) No texto 2, a função dos modalizadores é diminuir a credibilidade do estudo, indicando que suas\nconclusões não devem ser consideradas pela comunidade científica.\n( ) O texto 2 aventa evidências para os efeitos de melhora de humor que são exaltados no texto 3.\nEste último anuncia que a música enquanto atividade social melhora a qualidade de vida.\n( ) No texto 3, a escolha do registro dialetal evidencia uma falha no domínio da norma-padrão por\nparte do autor, o que compromete o alcance do poema para leitores que não compartilham da\nmesma variedade linguística.\n( ) No texto 2, a sintaxe reflete a necessidade do gênero de detalhar relações de causa e\nconsequência, enquanto no texto 3, a sintaxe mimetiza o ritmo da fala e da canção popular.\n( ) Embora diferentes, o propósito comunicativo de ambos os textos é prescritivo: o texto 2 prescreve\numa prática clínica baseada em evidências, e o texto 3 prescreve o canto como uma prática de\nbem-estar emocional.\nAssinale a alternativa que apresenta a sequência CORRETA, de cima para baixo.","a":"V – F – V – F – V – F.","r":"Verdadeira: No texto 3, a representação gráfica da fonética é um recurso estilístico que valoriza uma variedade linguística\nsocialmente estigmatizada como forma de expressão poética e de sabedoria popular.\n13\nO uso de grafias que imitam a pronúncia (como \"cantá\", \"cum\", \"noiti\") é uma escolha deliberada do autor. Essa estratégia confere\nlegitimidade e valor artístico a uma variedade do português que muitas vezes é alvo de preconceito, afirmando-a como um veículo\npotente para a expressão cultural e poética.\nFalsa: No texto 2, a função dos modalizadores é diminuir a credibilidade do estudo, indicando que suas conclusões não devem\nser consideradas pela comunidade científica.\nNo discurso científico, o uso de modalizadores (expressões como \"sugerem que\", \"não é possível ter certeza\") é um sinal de rigor\ne prudência acadêmica. Ao reconhecer as limitações da pesquisa, o autor demonstra honestidade intelectual, o que, na verdade,\nreforça a credibilidade do texto, em vez de diminuí-la.\nVerdadeira: O texto 2 aventa evidências para os efeitos de melhora de humor que são exaltados no texto 3. Este último anuncia\nque a música enquanto atividade social melhora a qualidade de vida.\nO texto 2 apresenta alguma evidência científica (ainda que preliminar) para os benefícios da música na melhora do humor em\npessoas com depressão. Estes efeitos são poeticamente celebrados no texto 3, que destaca a dimensão coletiva (\"cum muitos\namigos\", \"im bando\") quanto os efeitos sobre a qualidade de vida e o humor.\nFalsa: No texto 3, a escolha do registro dialetal evidencia uma falha no domínio da norma-padrão por parte do autor, o que\ncompromete o alcance do poema para leitores que não compartilham da mesma variedade linguística.\nA afirmativa parte de uma premissa baseada em preconceito linguístico. A utilização de uma variedade não-padrão em um texto\nliterário é uma escolha estética e política consciente, não uma \"falha\" ou falta de competência. Essa escolha enriquece o poema\ncom autenticidade e não necessariamente compromete seu alcance, pois a arte permite a compreensão para além da\nfamiliaridade com uma variedade específica.\nVerdadeira: No texto 2, a sintaxe reflete a necessidade do gênero de detalhar relações de causa e consequência, enquanto no\ntexto 3, a sintaxe mimetiza o ritmo da fala e da canção popular.\nO texto 2, sendo técnico-científico, emprega períodos complexos e orações subordinadas para construir uma argumentação lógica\ne precisa. O texto 3, por sua natureza poética, utiliza uma sintaxe mais simples, com períodos curtos e coordenados, que evocam\na oralidade e a musicalidade da poesia.\nFalsa: Embora diferentes, o propósito comunicativo de ambos os textos é prescritivo: o texto 2 prescreve uma prática clínica\nbaseada em evidências, e o texto 3 prescreve o canto como uma prática de bem-estar emocional.\nApenas o texto 3 é claramente prescritivo (aconselha ou ordena uma ação através do imperativo \"Cantá\"). O texto 2 tem um\npropósito primariamente descritivo e avaliativo: ele descreve o estado da pesquisa e avalia a qualidade das evidências. Sua\nconclusão cautelosa (\"não é possível ter certeza\") impede que ele seja classificado como prescritivo.","o":["V – F – V – F – V – F.","F – F – V – V – V – F.","F – V – F – V – F – V.","V – V – F – F – F – V."],"c":0},{"id":"n1790725574282","s":"Português","t":"Interpretação de Texto","q":"{TEXTO}\nCantá sintino sodade\nQui dexa as marca di verga\nDi arguém qui os óio num vê\nI o coração inda inxerga\n(...)\nCantá cum muitos amigos\nQui a vida canta mió\nÉ im bando qui os passarim\nCantano disperta o só\nCantá, cantá sempri mais:\nDi tardi, di noiti i di dia\nCantá, cantá qui a paiz\nCarece de mais cantoria\nCantá seja lá cumu fô\nSi a dô fô mais grandi qui o peito,\nCantá bem mais forti qui a dô \n\nA partir da análise da primeira estrofe do texto, avalie as afirmativas seguintes:\nI. A estrofe apresenta uma antítese entre o plano físico e o plano da memória, afirmando que a ausência física\nda pessoa não apaga sua presença no mundo interior do eu lírico.\nII. A expressão \"marca di verga\" é uma metáfora que caracteriza a saudade como um sofrimento que deixa\ncicatrizes profundas.\nIII. O primeiro verso indica que o ato de cantar é como um remédio para a dor da saudade, que transforma o\nsofrimento em esquecimento.\nÉ CORRETO o que se afirma em:","a":"I e II, apenas.","r":"Correta: I. A estrofe apresenta uma antítese entre o plano físico e o plano da memória, afirmando que a ausência física da pessoa\nnão apaga sua presença no mundo interior do eu lírico.\nNa estrofe há uma oposição (antítese) entre a percepção sensorial dos olhos (que não veem a pessoa ausente) e a percepção\ndo coração (que continua a \"ver\" ou sentir a pessoa).\nCorreta: II. A expressão \"marca di verga\" é uma metáfora que caracteriza a saudade como um sofrimento que deixa cicatrizes\nprofundas.\nOs versos fazem referência às “marca di verga”, que são marcas ou cicatrizes deixadas na pele por castigos na forma de golpes\nno corpo. A poesia associa a saudade a essas marcas, o eu lírico a define como um sentimento agudo, violento e que deixa\n“feridas” emocionais, ou seja, o sofrimento de sentir saudade de alguém.\nIncorreta: III. O primeiro verso indica que o ato de cantar é como um remédio para a dor da saudade, que transforma o sofrimento\nem esquecimento.\nO verso diz \" Cantá sintino sodade\", ou seja, o canto e a saudade coexistem, o ato de cantar é uma forma de expressar ou lidar\ncom o sentimento da saudade. A estrofe sugere que a dor persiste (\"marca di verga\"), e o canto acontece por causa dessa dor, e\nnão como uma cura que a apaga.","o":["I, II e III.","I e III, apenas.","II e III, apenas.","I e II, apenas."],"c":3},{"id":"n1790725687130","s":"Português","t":"Interpretação de Texto","q":"{TEXTO}\nMusicoterapia para depressão pode melhorar o\nhumor\n| 10 dez 2014 | ID: poems-80\nQuestão Clínica: Qual é a eficácia da musicoterapia\npara a depressão?\nResposta Baseada em Evidência: Comparado com o\ntratamento padrão, a musicoterapia foi aceita por\npessoas com depressão, e associada com melhora no\nhumor em quatro dos cinco estudos revisados.\nAlertas: O número reduzido e baixa qualidade\nmetodológica dos estudos sugerem que não é possível\nter certeza sobre a eficácia da musicoterapia. Grandes\nvariações nas intervenções oferecidas, populações\nestudadas e avaliações dos desfechos adotados\nsignificam que a síntese de dados quantitativos e metaanálise não foram adequadas. \n\n Sobre o uso da língua padrão e as características lexicais do texto, as afirmativas abaixo são corretas,\nEXCETO.","a":"O vocabulário remete primariamente a sentidos conotativos, pois palavras como \"melhora\" e \"eficácia\" apelam à emoção do leitor para persuadi-lo a adotar a musicoterapia como estratégia terapêutica.","r":"Questão solicita a identificação da alternativa INCORRETA (exceto).\nINCORRETA: O vocabulário remete primariamente a sentidos conotativos, pois palavras como \"melhora\" e \"eficácia\" apelam à\nemoção do leitor para persuadi-lo a adotar a musicoterapia como estratégia terapêutica.\nO texto utiliza uma linguagem denotativa (sentido literal), própria do discurso científico. Palavras como \"melhora\" e \"eficácia\" são\nempregadas em seu sentido técnico. Além disso, a seção \"Alertas\" faz exatamente o oposto de persuadir, pois ressalta as\nlimitações e a falta de certeza sobre os resultados, recomendando cautela na aplicação da musicoterapia como terapêutica.\nCORRETA: O texto utiliza a norma-padrão em um registro formal, o que é evidenciado pela seleção lexical e pelo uso de uma\nsintaxe adequada à comunicação científica.\nA linguagem do texto 2 é formal, segue a norma-padrão, é impessoal e utiliza uma estrutura sintática própria de textos técnicocientíficos.\nCORRETA: O léxico inclui termos técnicos específicos do campo da pesquisa em saúde, como \"meta-análise\", \"desfechos\" e\n\"qualidade metodológica\", garantindo a precisão da informação.\nO texto emprega jargão da área de pesquisa em saúde. Esses termos são usados para garantir a precisão e evitar ambiguidades,\ncomunicando conceitos complexos de forma exata para um público familiarizado com a área.\nCORRETA: O uso de construções na voz passiva, como em \"foi aceita\" e \"foram adequadas\", reforça a objetividade do texto, pois\nleva o foco para os procedimentos e resultados da pesquisa.\nA voz passiva é um recurso estilístico comum em textos científicos para criar um distanciamento e uma impressão de objetividade.\nAo dizer \"a musicoterapia foi aceita\", o foco recai sobre o fato em si, e não sobre quem praticou a ação (os pacientes ou\npesquisadores), o que é apropriado para o gênero textual.","o":["O léxico inclui termos técnicos específicos do campo da pesquisa em saúde, como \"meta-análise\", \"desfechos\" e \"qualidade metodológica\", garantindo a precisão da informação.","O texto utiliza a norma-padrão em um registro formal, o que é evidenciado pela seleção lexical e pelo uso de uma sintaxe adequada à comunicação científica.","O vocabulário remete primariamente a sentidos conotativos, pois palavras como \"melhora\" e \"eficácia\" apelam à emoção do leitor para persuadi-lo a adotar a musicoterapia como estratégia terapêutica.","O uso de construções na voz passiva, como em \"foi aceita\" e \"foram adequadas\", reforça a objetividade do texto, pois leva o foco para os procedimentos e resultados da pesquisa."],"c":2},{"id":"n1790725754466","s":"Português","t":"Literatura Brasileira","q":"Em Memórias Póstumas de Brás Cubas, de Machado de Assis, a relação entre a pneumonia que mata o\nprotagonista, o emplastro anti-hipocondríaco que ele pretendia inventar e a melancolia humana que buscava\ncurar revela aspectos fundamentais da estética realista.\nConsiderando essa tríade temática e sua função na obra, assinale a alternativa CORRETA.","a":"A morte por pneumonia representa uma ironia trágica típica do Realismo: Brás Cubas morre de uma doença física banal enquanto pretendia curar uma doença metafísica, demonstrando a desproporção entre ambições grandiosas e a realidade prosaica que caracteriza a visão realista do ser humano.","r":"","o":["A morte por pneumonia representa uma ironia trágica típica do Realismo: Brás Cubas morre de uma doença física banal enquanto pretendia curar uma doença metafísica, demonstrando a desproporção entre ambições grandiosas e a realidade prosaica que caracteriza a visão realista do ser humano.","O emplastro anti-hipocondríaco fracassa porque Brás Cubas morre de pneumonia antes de completá-lo, o que sugere que, se tivesse sobrevivido, teria alcançado a glória eterna prometida pela invenção, em conformidade com a visão realista de que a morte prematura impede a realização dos ideais humanos","A melancolia que o emplastro pretendia curar é apresentada como sintoma psicológico tratável pela ciência positivista do século XIX, refletindo a confiança realista no progresso científico como solução para os males existenciais da humanidade, perspectiva confirmada pelo narrador defunto.","A pneumonia funciona como punição moral pela vaidade de Brás Cubas em querer inventar o emplastro, seguindo o modelo realista de retribuição ética em que personagens egoístas são castigados pela morte, enquanto personagens altruístas alcançam redenção e reconhecimento social."],"c":0},{"id":"n1790725925866","s":"Inglês","t":"Reading Comprehension","q":"{TEXTO}\nWHO validates Brazil for eliminating mother-to-child transmission of HIV\n\nThe World Health Organization (WHO) has validated Brazil for the elimination of mother-to-child transmission (EMTCT) of HIV, making it the most populous country in the Americas to achieve this historic milestone. This accomplishment reflects Brazil’s long-standing commitment to universal and free access to health services through its Unified Health System (SUS), anchored in a strong primary health-care system and respect for human rights.\n\nBrazil met all the criteria for EMTCT validation, including reducing vertical transmission of HIV to below 2% and achieving over 95% coverage for prenatal care, routine HIV testing, and timely treatment for pregnant women living with HIV. In addition to meeting the targets of the validation, Brazil demonstrated the delivery of quality services for mothers and their infants, robust data and laboratory systems, and a strong commitment to human rights, gender equality and community engagement.\n\nThe evaluation, supported by PAHO, was conducted by independent experts who reviewed data, documentation, and health facility operations. Findings were then assessed by WHO’s Global Validation Advisory Committee, which formally recommended Brazil’s validation for elimination.\n\n“This achievement shows that eliminating vertical transmission of HIV is possible when pregnant women know their HIV status, receive timely treatment, and have access to maternal health services and safe delivery,” said Dr Jarbas Barbosa, Director of PAHO. “It is also the result of the tireless dedication of thousands of health professionals, community health workers, and civil society organizations. Every day, they sustain the continuity of care, identify obstacles, and work to overcome them, ensuring that even the most vulnerable populations can access essential health services.”\n\nAccording to the information provided in text 1, which of the following statements represents one of the text’s main ideas regarding the WHO announcement? Mark the only CORRECT alternative.","a":"Brazil's validation was contingent on meeting specific, measurable public health benchmarks for prenatal care and HIV transmission reduction.","r":"INCORRETA: “The achievement is a direct result of Brazil's long-standing commitment to a universal and free healthcare system\nknown as SUS.”\nEsta é uma ideia secundária, pois no texto é apresentada como um fator contribuinte. O texto afirma que a conquista \"reflete\" o\ncompromisso do Brasil com o Sistema Único de Saúde (SUS): “This accomplishment reflects Brazil’s long-standing commitment\nto universal and free access to health services”. A palavra \"reflects\" indica que o SUS é a base, o sistema que tornou a conquista\npossível. É uma razão subjacente para o sucesso, o que o caracteriza como uma informação de suporte que explica o contexto\nda ideia principal, mas não é a ideia principal em si.\n30\nINCORRETA: “A significant aspect of this milestone is that Brazil is the most populous nation in the Americas to have earned this\nvalidation.”\nO fato de o Brasil ser o \"país mais populoso das Américas\" a atingir o marco é mencionado no texto como uma conquista\nimportante no contexto mundial e regional: “making it the most populous country in the Americas to achieve this historic milestone”.\nContudo, este é um detalhe específico que adiciona contexto e fornece dimensão global à notícia principal. Ele serve para destacar\na relevância da conquista, mas não é a conquista em si. A ideia central é a validação pelos critérios da OMS, a qual continuaria\nválida mesmo sem essa informação demográfica ter sido mencionada no texto.\nINCORRETA: “The tireless work of thousands of health professionals and civil society organizations was essential in sustaining\nthe continuity of care.”\nEsta informação foi retirada da fala citada no texto do Dr. Jarbas Barbosa: “‘This achievement shows that eliminating vertical\ntransmission of HIV is possible when pregnant women know their HIV status, receive timely treatment, and have access to maternal\nhealth services and safe delivery,’ said Dr Jarbas Barbosa”. Citações geralmente servem para apoiar e explicar a ideia principal.\nA menção ao trabalho dos profissionais de saúde é um reconhecimento do esforço humano por trás do resultado alcançado. No\ntexto, é uma forma de reconhecer o mérito dos profisisonais responsáveis pelo sucesso, mas não descreve o resultado em si,\nque é a validação da OMS a partir dos critérios técnicos.\nCORRETA: “Brazil's validation was contingent on meeting specific, measurable public health benchmarks for prenatal care and\nHIV transmission reduction.”\nO texto anuncia que o Brasil foi validado pela OMS como um país que eliminou a transmissão gestacional de HVI de mãe para\nfilho. Uma parte central dessa ideia envolve explicar o que essa validação significa e o que foi necessário para alcançá-la. No\nsegundo parágrafo são detalhados os critérios objetivos necessários para que houvesse esse reconhecimento: “...reducing\nvertical transmission of HIV to below 2% and achieving over 95% coverage for prenatal care, routine HIV testing, and timely\ntreatment for pregnant women living with HIV. In addition to meeting the targets of the validation, Brazil demonstrated the delivery\nof quality services for mothers and their infants, robust data and laboratory systems, and a strong commitment to human rights,\ngender equality and community engagement”.\nOs requisitos técnicos e mensuráveis para a validação são parte central da notícia, e não um mero detalhe.","o":["The tireless work of thousands of health professionals and civil society organizations was essential in sustaining the continuity of care.","The achievement is a direct result of Brazil's long-standing commitment to a universal and free healthcare system known as SUS.","A significant aspect of this milestone is that Brazil is the most populous nation in the Americas to have earned this validation.","Brazil's validation was contingent on meeting specific, measurable public health benchmarks for prenatal care and HIV transmission reduction."],"c":3},{"id":"n1790725996339","s":"Inglês","t":"Reading Comprehension","q":"{TEXT}\nWHO validates Brazil for eliminating mother-to-child transmission of HIV\n\nThe World Health Organization (WHO) has validated Brazil for the elimination of mother-to-child transmission (EMTCT) of HIV, making it the most populous country in the Americas to achieve this historic milestone. This accomplishment reflects Brazil’s long-standing commitment to universal and free access to health services through its Unified Health System (SUS), anchored in a strong primary health-care system and respect for human rights.\n\nBrazil met all the criteria for EMTCT validation, including reducing vertical transmission of HIV to below 2% and achieving over 95% coverage for prenatal care, routine HIV testing, and timely treatment for pregnant women living with HIV. In addition to meeting the targets of the validation, Brazil demonstrated the delivery of quality services for mothers and their infants, robust data and laboratory systems, and a strong commitment to human rights, gender equality and community engagement.\n\nThe evaluation, supported by PAHO, was conducted by independent experts who reviewed data, documentation, and health facility operations. Findings were then assessed by WHO’s Global Validation Advisory Committee, which formally recommended Brazil’s validation for elimination.\n\n“This achievement shows that eliminating vertical transmission of HIV is possible when pregnant women know their HIV status, receive timely treatment, and have access to maternal health services and safe delivery,” said Dr Jarbas Barbosa, Director of PAHO. “It is also the result of the tireless dedication of thousands of health professionals, community health workers, and civil society organizations. Every day, they sustain the continuity of care, identify obstacles, and work to overcome them, ensuring that even the most vulnerable populations can access essential health services.”\n\nThe expression that could appropriately replace \"In addition to\" while maintaining the same\ngrammatical structure and meaning present in text 1 is:","a":"Besides.","r":"INCORRETA: Moreover\n\"Moreover\" é um advérbio que não pode ser seguido diretamente por uma frase nominal ou uma frase com gerúndio como\n\"meeting the targets\". A frase precisaria ser reestruturada, alterando a estrutura gramatical do texto, que é um critério da questão:\n\"Brazil met the targets of the validation. Moreover, Brazil demonstrated...\" No contexto original, usar \"moreover\" nesse lugar gera\nerro gramatical.\nINCORRETA: Furthermore\n\"Furthermore\" é um advérbio usado para conectar ideias entre sentenças ou orações independentes. No texto, não pode substituir\n\"in addition to\" porque não introduz diretamente uma frase com gerúndio (\"meeting the targets\"). Seria necessário dividir ou\nreestruturar a frase.\nCORRETA: Besides\n\"Besides\" funciona como preposição (semelhante a \"in addition to\") e pode ser seguida diretamente pelo gerúndio, no caso\n\"meeting”. Essa palavra preserva a mesma estrutura gramatical e o mesmo sentido: indica que o Brasil fez algo além de cumprir\nas metas de validação: \"Besides meeting the targets of the validation, Brazil demonstrated...\"\nINCORRETA: Additionally\n“Additionally” funciona como palavra de ligação entre sentenças ou orações que transmite ideia de adição de informação, porém\nnão pode ser usada com a mesma estrutura gramatical de \"in addition to\", pois não pode preceder diretamente uma frase com\ngerúndio. a frase precisaria ser reescrita: \"Brazil, additionally, demonstrated...\"","o":["Furthermore.","Moreover.","Besides.","Additionally."],"c":2},{"id":"n1790726082969","s":"Inglês","t":"Vocabulary","q":"{TEXT}\nWHO validates Brazil for eliminating mother-to-child transmission of HIV\n\nThe World Health Organization (WHO) has validated Brazil for the elimination of mother-to-child transmission (EMTCT) of HIV, making it the most populous country in the Americas to achieve this historic milestone. This accomplishment reflects Brazil’s long-standing commitment to universal and free access to health services through its Unified Health System (SUS), anchored in a strong primary health-care system and respect for human rights.\n\nBrazil met all the criteria for EMTCT validation, including reducing vertical transmission of HIV to below 2% and achieving over 95% coverage for prenatal care, routine HIV testing, and timely treatment for pregnant women living with HIV. In addition to meeting the targets of the validation, Brazil demonstrated the delivery of quality services for mothers and their infants, robust data and laboratory systems, and a strong commitment to human rights, gender equality and community engagement.\n\nThe evaluation, supported by PAHO, was conducted by independent experts who reviewed data, documentation, and health facility operations. Findings were then assessed by WHO’s Global Validation Advisory Committee, which formally recommended Brazil’s validation for elimination.\n\n“This achievement shows that eliminating vertical transmission of HIV is possible when pregnant women know their HIV status, receive timely treatment, and have access to maternal health services and safe delivery,” said Dr Jarbas Barbosa, Director of PAHO. “It is also the result of the tireless dedication of thousands of health professionals, community health workers, and civil society organizations. Every day, they sustain the continuity of care, identify obstacles, and work to overcome them, ensuring that even the most vulnerable populations can access essential health services.”\n----------------------------------------------------\nAccording to the Merriam-Webster dictionary, the word “delivery” can be defined as:\nI. the act of taking something to a person or place.\nII. the act or process of giving birth.\nIII. the way something is said officially or publicly.\nIV. something delivered.\nMark the option that fully contains the meaning of the word “delivery” used in text 1.","a":"I and II.","r":"INCORRETA: II only.\nEsta alternativa está incompleta, pois reconhece corretamente o uso da palavra “delivery” como “parto” (sentido II), mas ignora o\nprimeiro uso (sentido I).\nINCORRETA: I and III.\n32\nA alternativa contempla o uso da palavra com o sentido I corretamente, mas inclui na resposta a definição III, que corresponde à\nmaneira como algo é dito oficial ou publicamente. Esta definição não tem relação com o sentido da palavra no texto 1.\nINCORRETA: III and IV.\nEsta alternativa contém duas definições que não se aplicam ao texto. A definição III se refere a maneira de apresentar uma fala\nou anúncio público. Já a definição IV se refere a “algo que foi entregue”, ou seja, tem valor de substantivo (“a entrega”), o que\ntambém não se encaixa em nenhum dos contextos apresentados no texto 1.\nCORRETA: I and II.\nO texto 1 utiliza a palavra \"delivery\" com dois significados diferentes: (1) Na linha 7: \"...Brazil demonstrated the delivery of quality\nservices...\" (o Brasil demonstrou a prestação de serviços de qualidade). Este uso corresponde à definição I. o ato de levar algo a\numa pessoa ou lugar (neste caso, \"levar\" serviços à população). (2) Na linha 14: \"...and have access to maternal health services\nand safe delivery\" (...e ter acesso a serviços de saúde materna e parto seguro). Este uso corresponde à definição II. o ato ou\nprocesso de dar à luz.","o":["III and IV.","II only.","I and III.","I and II."],"c":3},{"id":"n1790726160570","s":"Inglês","t":"Reading Comprehension","q":"{TEXT}\nWHO validates Brazil for eliminating mother-to-child transmission of HIV\n\nThe World Health Organization (WHO) has validated Brazil for the elimination of mother-to-child transmission (EMTCT) of HIV, making it the most populous country in the Americas to achieve this historic milestone. This accomplishment reflects Brazil’s long-standing commitment to universal and free access to health services through its Unified Health System (SUS), anchored in a strong primary health-care system and respect for human rights.\n\nBrazil met all the criteria for EMTCT validation, including reducing vertical transmission of HIV to below 2% and achieving over 95% coverage for prenatal care, routine HIV testing, and timely treatment for pregnant women living with HIV. In addition to meeting the targets of the validation, Brazil demonstrated the delivery of quality services for mothers and their infants, robust data and laboratory systems, and a strong commitment to human rights, gender equality and community engagement.\n\nThe evaluation, supported by PAHO, was conducted by independent experts who reviewed data, documentation, and health facility operations. Findings were then assessed by WHO’s Global Validation Advisory Committee, which formally recommended Brazil’s validation for elimination.\n\n“This achievement shows that eliminating vertical transmission of HIV is possible when pregnant women know their HIV status, receive timely treatment, and have access to maternal health services and safe delivery,” said Dr Jarbas Barbosa, Director of PAHO. “It is also the result of the tireless dedication of thousands of health professionals, community health workers, and civil society organizations. Every day, they sustain the continuity of c
