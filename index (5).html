<style>
:root{--c1:#ff4a4a;--c2:#f80000;--b1:#ffcc85;--b2:#ff7f47;--ac:#ff6a1a;--ink:#1c1410;--card:#fffaf3;--ln:rgba(140,60,0,.16)}
*{box-sizing:border-box}
html{background:var(--b2);color-scheme:light}
body{margin:0;min-height:100vh;color:var(--ink);font:500 16px/1.45 "Space Grotesk","Segoe UI",Arial,sans-serif;background:linear-gradient(165deg,var(--b1),var(--b2)) fixed}
main{max-width:720px;margin:0 auto;padding:18px 18px 56px;padding-top:max(18px,env(safe-area-inset-top))}
.logo{font-family:"Archivo Black",Impact,sans-serif;margin:0;line-height:1;letter-spacing:-.02em;color:#000;text-shadow:2px 2px 0 rgba(255,255,255,.55)}
.logo.big{font-size:clamp(3.4rem,16vw,6.5rem);text-align:center;margin-top:28px}
.tag{text-align:center;font-size:1.15rem;margin:10px 0 40px;opacity:.85}
.h2,.h3,.big b,.panel h3{font-family:"Archivo Black","Arial Black",Impact,sans-serif;text-transform:uppercase}
.h2{font-size:clamp(1.6rem,6vw,2.3rem);line-height:1.08;margin:24px 0 18px}
.h3{font-size:1rem;margin:0 0 12px;letter-spacing:.02em}
.menu{display:grid;gap:16px;max-width:640px;margin:0 auto}
.big{display:flex;flex-direction:column;justify-content:center;gap:4px;width:100%;min-height:104px;border:0;border-radius:26px;padding:20px 28px;text-align:left;cursor:pointer;color:#000;background:linear-gradient(180deg,var(--c1),var(--c2));box-shadow:0 12px 28px rgba(190,20,0,.28);transition:transform .15s,box-shadow .15s}
.big:hover{transform:translateY(-2px);box-shadow:0 16px 32px rgba(190,20,0,.34)}
.big b{font-size:clamp(1.3rem,5vw,1.8rem)}
.big small{font-weight:600;font-size:.95rem;opacity:.85}
.panel,.cp{background:var(--card);border-radius:26px;padding:22px;margin-bottom:18px;box-shadow:0 8px 26px rgba(150,50,0,.14);border:1px solid rgba(255,255,255,.75)}
.panel h3{font-size:1.2rem;margin:0 0 14px;cursor:pointer;display:flex;align-items:center;gap:10px}
.panel h3::before{content:"";width:8px;height:1.1em;border-radius:4px;background:linear-gradient(var(--c1),var(--c2))}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.chip{border:1.5px solid rgba(255,106,26,.4);border-radius:999px;padding:8px;min-height:44px;background:#fff;font:inherit;font-weight:600;font-size:.85rem;color:var(--ink);cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--ac)}
.chip.on{background:linear-gradient(180deg,var(--c1),var(--c2));color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(200,20,0,.3)}
.chip.z{opacity:.6}
.tog{width:100%;min-height:52px;margin-bottom:18px;font-size:1rem}
.cta{display:inline-block;border:0;border-radius:999px;padding:15px 34px;margin:6px;background:linear-gradient(180deg,#ffb020,var(--ac));font:inherit;font-weight:700;font-size:1.05rem;color:#000;cursor:pointer;text-decoration:none;box-shadow:0 8px 22px rgba(255,106,26,.4);transition:transform .15s}
.cta:hover{transform:translateY(-1px)}
.cta.bad{background:#fff;color:#b00000;border:2px solid #d80000;box-shadow:none}
.center{text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
.top{display:flex;align-items:center;gap:12px}
.top .logo{font-size:1.9rem;flex:1;text-align:center;margin-right:46px}
.back{width:46px;height:46px;border:0;border-radius:50%;background:#fff;box-shadow:0 4px 14px rgba(150,50,0,.2);font-size:1.3rem;font-weight:700;cursor:pointer}
.lnk{border:0;background:none;font:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:6px 0;color:var(--c2)}
.pills{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:18px}
.pill{flex:1;min-width:140px;text-align:center;border-radius:22px;padding:14px;background:var(--card);box-shadow:0 8px 26px rgba(150,50,0,.14)}
.pill.wide{flex-basis:100%}
.pill b{display:block;font:1.8rem "Archivo Black",Impact,sans-serif;color:var(--c2)}
.bar{height:10px;border-radius:99px;background:#ffd9d2;overflow:hidden}
.bar i{display:block;height:100%;background:#1f9d55;border-radius:99px}
.bar.n{background:rgba(0,0,0,.1)}
.prog{height:8px;border-radius:99px;background:rgba(255,255,255,.55);overflow:hidden;margin-top:14px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--c1),var(--c2));transition:width .3s}
.sr{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.grp{padding-bottom:12px;margin-bottom:12px;border-bottom:1px dashed var(--ln)}
.sub{margin:8px 0 0 14px;font-size:.92rem}
.li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--ln)}
.li[role=button]{cursor:pointer}
.li button{border:0;background:none;color:#b00000;font-size:1.3rem;cursor:pointer}
.badge{background:var(--c2);color:#fff;border-radius:99px;padding:0 10px;align-self:center;white-space:nowrap;font-size:.85rem}
.mut{opacity:.75;font-size:.9rem}
.warn{color:#a00000;font-weight:700}
input,textarea,select{width:100%;border:1.5px solid var(--ln);border-radius:14px;padding:12px 14px;margin-bottom:10px;font:inherit;color:var(--ink);background:#fff}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px rgba(255,106,26,.2)}
input[type=color]{height:44px;padding:4px}
textarea{resize:vertical}
label{display:block;font-size:.85rem;font-weight:600;margin-bottom:6px}
label input{margin-top:4px}
details{border-top:1px solid var(--ln);padding:8px 0}
summary{cursor:pointer;font-weight:700}
.ed{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fe{background:#fff;border:1.5px dashed var(--ac);border-radius:18px;padding:14px;margin:8px 0}
.mcf{display:none}.mc .mcf{display:block}.mc .sf{display:none}
.fc{perspective:1000px;min-height:340px;cursor:pointer;margin:14px 0}
.fc .in{position:relative;min-height:340px;transition:transform .5s;transform-style:preserve-3d}
.fc.flip .in{transform:rotateY(180deg)}
.face,.qbox{background:#fff;border-radius:28px;padding:28px;text-align:center;font-size:1.5rem;display:flex;align-items:center;justify-content:center;box-shadow:0 14px 36px rgba(150,50,0,.2)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.back{transform:rotateY(180deg);background:linear-gradient(180deg,var(--c1),var(--c2));color:#000}
.qbox{min-height:190px;margin:14px 0}
.opts{display:grid;grid-template-columns:1fr;gap:10px;margin:12px 0}
.opt{border:1.5px solid var(--ln);border-radius:18px;padding:16px 20px;background:#fff;font:inherit;font-weight:600;font-size:1.05rem;text-align:left;color:var(--ink);cursor:pointer;transition:.15s;box-shadow:0 4px 14px rgba(150,50,0,.1)}
.opt:hover:not(:disabled){border-color:var(--ac)}
.opt:disabled{cursor:default;color:var(--ink)}
.opt.ok{background:#d4f7dc;border-color:#0a7a30}
.opt.no{background:#ffd6d6;border-color:#b00000}
.rv{background:#fff;border-left:6px solid var(--c2);border-radius:20px;padding:16px 18px;margin:14px 0;box-shadow:0 6px 18px rgba(150,50,0,.12)}
.rv p{margin:0 0 12px}
.ph{border:2px dashed var(--ln);border-radius:16px;padding:14px;text-align:center;opacity:.75}
:focus-visible{outline:3px solid #000;outline-offset:2px}
@media (min-width:800px){main{max-width:960px}.chips{grid-template-columns:repeat(4,1fr)}.opts{grid-template-columns:1fr 1fr}.pill.wide{flex-basis:auto}.menu{max-width:none;grid-template-columns:repeat(3,1fr)}.big{min-height:150px}}
@media (prefers-reduced-motion:reduce){.fc .in,.prog i{transition:none}}
</style>

/* ===== DADOS E ESTADO ===== */
var EMB=/*EMB*/[{"id":"d0","s":"Física","t":"Cinemática","q":"Qual a fórmula da velocidade média?","a":"v = Δs / Δt","r":"Velocidade média é a variação de posição dividida pelo intervalo de tempo. No SI, a unidade é m/s."},{"id":"d1","s":"Física","t":"Cinemática","q":"Um carro vai de 0 a 20 m/s em 4 s. Qual a aceleração média?","a":"5 m/s²","r":"Aceleração média = Δv/Δt = 20/4 = 5 m/s².","o":["2 m/s²","5 m/s²","10 m/s²","80 m/s²"],"c":1},{"id":"d2","s":"Física","t":"Dinâmica","q":"Enuncie a 2ª Lei de Newton.","a":"F = m·a","r":"A força resultante sobre um corpo é igual à massa vezes a aceleração."},{"id":"d3","s":"Física","t":"Dinâmica","q":"Qual a unidade de força no SI?","a":"Newton","r":"Força se mede em newtons (N): 1 N = 1 kg·m/s².","o":["Joule","Watt","Newton","Pascal"],"c":2},{"id":"d4","s":"Física","t":"Eletricidade","q":"Um resistor de 10 Ω é atravessado por 2 A. Qual a tensão?","a":"20 V","r":"1ª Lei de Ohm: U = R·i = 10·2 = 20 V.","o":["5 V","12 V","20 V","0,2 V"],"c":2},{"id":"d5","s":"Química","t":"Atomística","q":"O que define o número atômico (Z)?","a":"O número de prótons no núcleo.","r":"O número atômico identifica o elemento químico: é a quantidade de prótons do núcleo."},{"id":"d6","s":"Química","t":"Ligações Químicas","q":"Qual ligação ocorre entre Na e Cl no NaCl?","a":"Iônica","r":"Entre metal e ametal há transferência de elétrons: formam-se íons que se atraem (ligação iônica).","o":["Covalente","Iônica","Metálica","Van der Waals"],"c":1},{"id":"d7","s":"Matemática","t":"Função Afim","q":"Qual o coeficiente angular de f(x) = 3x + 5?","a":"3","r":"Em f(x) = ax + b, 'a' é o coeficiente angular (inclinação da reta) e 'b' o coeficiente linear.","o":["5","3","8","−3"],"c":1},{"id":"d8","s":"Matemática","t":"Probabilidade","q":"Qual a probabilidade de tirar face 6 em um dado justo?","a":"1/6","r":"Probabilidade = casos favoráveis ÷ casos possíveis = 1/6.","o":["1/2","1/3","1/6","1/12"],"c":2},{"id":"d9","s":"Matemática","t":"Geometria Plana","q":"Qual a área de um círculo de raio r?","a":"A = π·r²","r":"A área do círculo é π vezes o quadrado do raio."},{"id":"d10","s":"Português","t":"Figuras de Linguagem","q":"'Ele é uma raposa nos negócios' é exemplo de:","a":"Metáfora","r":"Metáfora compara elementos sem usar 'como', atribuindo a um as qualidades do outro.","o":["Metáfora","Hipérbole","Ironia","Eufemismo"],"c":0},{"id":"d11","s":"Inglês","t":"Verb Tenses","q":"Choose the correct form: 'She ___ to school yesterday.'","a":"went","r":"'Yesterday' indica passado simples: go → went.","o":["go","goes","went","gone"],"c":2},{"id":"d12","s":"Biologia","t":"Citologia","q":"Qual organela realiza a respiração celular?","a":"Mitocôndria","r":"As mitocôndrias produzem ATP na respiração celular aeróbica.","o":["Ribossomo","Mitocôndria","Lisossomo","Complexo de Golgi"],"c":1},{"id":"d13","s":"História","t":"Era Vargas","q":"Qual regime foi instaurado por Vargas em 1937?","a":"Estado Novo","r":"Em 1937 Vargas deu um golpe e implantou o Estado Novo, ditadura que durou até 1945.","o":["Império","Estado Novo","República Velha","Regência"],"c":1},{"id":"d14","s":"Geografia","t":"Climatologia","q":"Qual o clima predominante na Amazônia?","a":"Equatorial","r":"Clima equatorial: quente e úmido o ano todo, com chuvas abundantes.","o":["Semiárido","Equatorial","Subtropical","Temperado"],"c":1},{"id":"n1790721233154","s":"Português","t":"Interpretação de Texto","q":"[TEXTO 1}\n\nDo século 11 até o início do século 19, um rito de cura era realizado pelos reis da França e da Inglaterra. Eles eram considerados como tendo um poder divino, hereditário, de curar com as próprias mãos a escrófula, uma linfadenite tuberculosa que afeta principalmente os nódulos linfáticos cervicais. O rito acontecia regularmente com grupos de pacientes que se preparavam para essa cerimônia. A crença nesse poder milagroso baseava-se no fato de os reis terem sido ungidos e coroados em cerimônia religiosa, adquirindo assim uma natureza sacerdotal. Talvez seja umas das fake news mais duradouras da história.\n\nAinda que durem menos tempo, a quantidade de promessas e encantos que proliferam em redes sociais é avassaladora na pandemia do coronavírus. Quando o esforço deveria ser por uma batalha lado a lado, contra a doença, gasta-se energia na guerra da contrainformação. Desnudou-se fanatismo de todos os lados.\n\nCabe, portanto, responsabilidade e maturidade para entender o que ocorre. O método científico não é uma bandeira ideológica, mas uma técnica consistente de testar hipóteses e chegar em verdades. Avanços médicos, mesmo com necessidade de celeridade, devem ser cuidadosos e reproduzíveis. Soluções muito simplificadas e temperadas por teorias conspiratórias devem ser vistas com muito cuidado.\n\nAo mesmo tempo, deve haver sensibilidade para calibrar o entendimento de riscos reais, para não trocar uma doença por outra. Atrasar revisões médicas e não sair de casa nem para doar sangue não protege, nem as pessoas e nem o sistema de saúde!\n\nMas temos boas notícias. A humanidade tem se esforçado para buscar respostas de forma inédita. A investigação de dezenas de remédios e vacinas está em franco progresso. Enquanto isso, continua sendo importante lavar as mãos. Só que não existe solução simples, como uma cura pelo toque do rei.\n\nA propósito, as pessoas ficavam curadas, o que alimentava as suas crenças, porque lavavam suas chagas para que o rei as tocasse. Não era o rei... eram a água e o sabão.\n\n--------\nA partir da leitura da crônica (Texto 1), avalie as afirmações e selecione aquela que melhor expressa a crítica do autor às crenças em soluções milagrosas para problemas de saúde.","a":"B. A aparente eficácia de certas práticas curativas frequentemente resulta de fatores secundários cientificamente válidos, mas que são ignorados pelos crentes, perpetuando a falsa atribuição de resultados positivos a elementos místicos","r":"O texto critica a crença em curas milagrosas mostrando que o resultado aparentemente sobrenatural pode ter uma explicação concreta e científica. No caso dos reis, as pessoas realmente melhoravam, mas não por causa do “poder de cura” do rei: elas lavavam as feridas antes do contato, e eram a água e o sabão que ajudavam na recuperação. Assim, o erro estava em atribuir o resultado a uma causa mística, ignorando o verdadeiro fator responsável.\n\nPor que as outras estão erradas?\n\nA: afirma que as curas milagrosas apresentam resultados reais por causa do próprio tratamento, o que o texto não defende.\nC: contradiz diretamente o texto, que afirma que o método científico é essencial, inclusive em situações de crise.\nD: também contraria o autor, que questiona justamente a atribuição de efeitos terapêuticos à fé ou ao sobrenatural.\n\nMacete para a prova: procure no final do texto a explicação do autor: “Não era o rei... eram a água e o sabão.” Essa frase resume a crítica central: um resultado real não significa que a explicação dada para ele seja verdadeira.","o":["A. Crenças em “curas milagrosas” persistem ao longo da história porque esses tratamentos apresentam resultados reais, ainda que parciais, daí a necessidade de investigar cientificamente todas as práticas tradicionais antes de descartá-las como ineficazes.","B. A aparente eficácia de certas práticas curativas frequentemente resulta de fatores secundários cientificamente válidos, mas que são ignorados pelos crentes, perpetuando a falsa atribuição de resultados positivos a elementos místicos","C. O método científico deve ser relativizado em contextos de crise sanitária, pois a história demonstra que práticas empíricas simples, mesmo quando baseadas em crenças populares, podem ser eficazes.","D. A longevidade de crenças em poderes curativos sobrenaturais evidencia que a fé desempenha um papel terapêutico legítimo, razão pela qual tais crenças não devem ser completamente substituídas pelo racionalismo científico."],"c":1},{"id":"n1790721636745","s":"Português","t":"Interpretação de Texto","q":"{TEXTO}\n\nDo século 11 até o início do século 19, um rito de cura era realizado pelos reis da França e da Inglaterra. Eles eram considerados como tendo um poder divino, hereditário, de curar com as próprias mãos a escrófula, uma linfadenite tuberculosa que afeta principalmente os nódulos linfáticos cervicais. O rito acontecia regularmente com grupos de pacientes que se preparavam para essa cerimônia. A crença nesse poder milagroso baseava-se no fato de os reis terem sido ungidos e coroados em cerimônia religiosa, adquirindo assim uma natureza sacerdotal. Talvez seja umas das fake news mais duradouras da história.\n\nAinda que durem menos tempo, a quantidade de promessas e encantos que proliferam em redes sociais é avassaladora na pandemia do coronavírus. Quando o esforço deveria ser por uma batalha lado a lado, contra a doença, gasta-se energia na guerra da contrainformação. Desnudou-se fanatismo de todos os lados.\n\nCabe, portanto, responsabilidade e maturidade para entender o que ocorre. O método científico não é uma bandeira ideológica, mas uma técnica consistente de testar hipóteses e chegar em verdades. Avanços médicos, mesmo com necessidade de celeridade, devem ser cuidadosos e reproduzíveis. Soluções muito simplificadas e temperadas por teorias conspiratórias devem ser vistas com muito cuidado.\n\nAo mesmo tempo, deve haver sensibilidade para calibrar o entendimento de riscos reais, para não trocar uma doença por outra. Atrasar revisões médicas e não sair de casa nem para doar sangue não protege, nem as pessoas e nem o sistema de saúde!\n\nMas temos boas notícias. A humanidade tem se esforçado para buscar respostas de forma inédita. A investigação de dezenas de remédios e vacinas está em franco progresso. Enquanto isso, continua sendo importante lavar as mãos. Só que não existe solução simples, como uma cura pelo toque do rei. ------------------ Analise as afirmações a seguir e selecione aquela que identifica CORRETAMENTE a estratégia composicional\npredominante no texto 1.","a":"O cronista emprega uma estrutura circular: episódio histórico → argumentação contemporânea → retomada do exemplo inicial. O final ressignifica a narrativa histórica, enquanto reafirma a crítica ao presente.","r":"Resumo comentado da resolução:\nO texto apresenta uma estrutura circular: começa contando o episódio histórico da “cura pelo toque do rei”, depois relaciona essa crença com as promessas e curas milagrosas durante a pandemia e, no final, retoma o caso dos reis para revelar a verdadeira explicação das supostas curas: “eram a água e o sabão”.\n\nAssim, o final volta ao exemplo apresentado no início, mas agora com um novo significado. Essa retomada reforça a crítica do autor às explicações milagrosas e à falta de análise científica.\n\nMacete: quando um texto começa com um exemplo, desenvolve uma discussão e termina retomando aquele mesmo exemplo, pense em estrutura circular.","o":["O autor adota estrutura tese-antítese-síntese: valorização inicial de práticas tradicionais → contraposição pela defesa do método científico → síntese equilibrada sobre ambas perspectivas.","O texto utiliza uma progressão linear cronológica: parte da evolução histórica para demonstrar como as sociedades gradualmente superaram crenças irracionais por meio do desenvolvimento do pensamento científico.","A crônica organiza-se por contraposição entre dois blocos independentes: de um lado o relato histórico, de outro a análise da pandemia. A justaposição permite que o leitor extraia suas próprias conclusões de ambos eventos.","O cronista emprega uma estrutura circular: episódio histórico → argumentação contemporânea → retomada do exemplo inicial. O final ressignifica a narrativa histórica, enquanto reafirma a crítica ao presente."],"c":3},{"id":"n1790721806680","s":"Matemática","t":"Funções","q":"Tumores malignos, popularmente conhecidos como câncer, são caracterizados pelo crescimento desordenado\ne agressivo de células anormais. Diferente dos tumores benignos, essas células têm a capacidade de invadir\ntecidos e órgãos vizinhos, além de se espalharem para outras partes do corpo por meio da corrente sanguínea\nou do sistema linfático, processo denominado metástase.\nEm um caso clínico, o volume, 𝑉(𝑡), de um tipo específico de tumor, em 𝑐𝑚ଷ\n, foi modelado em função do tempo\n𝑡, em meses, pela função\n𝑉(𝑡) = 𝑎 ∙ ln (𝑡 + 1)\nonde 𝑎 ∈ ℝ.\nSabe-se que, com 𝑡 = 7 𝑚𝑒𝑠𝑒𝑠, o volume do tumor era de 8,32 𝑐𝑚ଷ\n.\nDetermine o volume, em 𝑐𝑚ଷ\n, do tumor no instante 𝑡 = 51 𝑑𝑖𝑎𝑠.\nConsidere 1 𝑚ê𝑠 = 30 𝑑𝑖𝑎𝑠, ln(8) = 2,08 e 𝑒 = 2,7.","a":"4 cm³","r":"","o":["3 cm³","4 cm³","4,8 cm³","5,1 cm³"],"c":1},{"id":"n1790722104201","s":"Matemática","t":"Geometria Analítica","q":"Seja o triângulo 𝐴𝐵𝐶 com 𝐴(5,10), 𝐵(11,4) e 𝐶(9,2).\nDetermine a área do círculo circunscrito ao triângulo 𝐴𝐵𝐶.","a":"20π unidades de área","r":"","o":["10π unidades de área","15π unidades de área","16π unidades de área","20π unidades de área"],"c":3},{"id":"n1790722292056","s":"Física","t":"Eletricidade","q":"Enquanto você lê esta questão e organiza o raciocínio para resolvê-la, bilhões de neurônios no seu sistema\nnervoso estão ativos. Cada pensamento, cada decisão e cada cálculo realizado durante a prova envolve a\npropagação de sinais elétricos ao longo de neurônios, fenômeno conhecido como potencial de ação. Esses\nsinais dependem do deslocamento ordenado de íons através da membrana neuronal, como o ion Na⁺, cuja\nmovimentação altera a energia do sistema e sustenta processos essenciais como percepção, memória e\nmovimento voluntário. Embora o funcionamento real de um neurônio seja biologicamente complexo, modelos\nfísicos simplificados permitem compreender aspectos essenciais desse mecanismo.\nConsidere um modelo no qual um íon Na⁺ atravessa uma região da membrana celular onde existe um\ncampo elétrico supostamente uniforme, que realiza trabalho sobre a carga ao longo de uma trajetória retilínea.\n50\nDurante a travessia, o íon sofre um aumento de energia (de natureza mecânica) em 4,8 x 10−21 J ao\npercorrer uma distância de 2,0 nm no sentido do campo. Despreze colisões, efeitos dissipativos e quaisquer\noutras forças além da força elétrica.\nAssinale a alternativa que apresenta o módulo do campo elétrico uniforme nessa região da membrana.","a":"1,5 × 107  V/m","r":"","o":["1,5 × 107  V/m","1,5 × 106  V/m","3,0 × 108  V/m","3,0 × 107  V/m"],"c":0},{"id":"n1790722600145","s":"Química","t":"Tabela Periódica","q":"Um grupo de 17 elementos químicos tem chamado cada vez mais a atenção do mundo: as Terras Raras. Esse\ngrupo é composto, principalmente, pelos lantanídeos, e são de grande importância estratégica, comercial e\npolítica, pois são bastante reativos, quando comparados com outros metais. Elementos como o Neodímio, o\nPraseodímio e o Gadolínio são utilizados, por exemplo, na fabricação de componentes eletrônicos presentes\nem smartphones e carros elétricos, ímãs de alta potência e até mesmo tecnologias militares. O Brasil possui a\nsegunda maior reserva natural de elementos de Terras Raras do mundo, com cerca de 21 milhões de toneladas,\natrás apenas da China.\nSobre as propriedades químicas e físicas dos elementos de Terras Raras, assinale a alternativa CORRETA","a":"Os elétrons de diferenciação dos elementos de Terras Raras, em sua maioria, estão no subnível 4f, que possui baixa participação em ligações químicas.","r":"a). Incorreta. Embora sejam chamados de “Terras Raras”, estes elementos são abundantes na crosta terrestre. O problema é que\neles não são encontrados de formas economicamente viáveis e de fácil mineração, pois estão presentes em baixa concentração,\nespalhados por uma área muito grande.\nb) Incorreta. Estes elementos são todos metais de grandes raios atômicos.\nc) Incorreta. Por serem muito reativos, estes elementos são encontrados em formas de óxidos, fosfatos, entre outros compostos.\nd) Correta","o":["Embora seja de fácil mineração, estes elementos são bastante escassos na natureza especialmente quando comparados com outros metais mais comuns, como a prata ou o cádmio","A alta reatividade destes elementos é devida aos seus raios atômicos, que são pequenos quando comparados com os de outros metais.","Os elementos de terras raras são encontrados na natureza normalmente em sua forma metálica.","Os elétrons de diferenciação dos elementos de Terras Raras, em sua maioria, estão no subnível 4f, que possui baixa participação em ligações químicas."],"c":3},{"id":"n1790722738552","s":"Química","t":"Ácidos e Bases","q":"O ácido fórmico é um ácido orgânico de baixa massa molecular, e é um contaminante comum em efluentes\nindustriais, especialmente de setores têxteis. Ele pode ser neutralizado com o uso de óxido de zinco, segundo\na reação química equacionada a seguir:\nZnO + 2 HCOOH → Zn(HCOO)2 + H2O\nSobre esta reação e as substâncias nela envolvidas, assinale a alternativa CORRETA.","a":"O óxido de zinco é um óxido anfótero, apresentando comportamento alcalino na presença do ácido fórmico.","r":"a) Incorreta. Sais de ácidos carboxílicos curtos, como os acetatos e formiatos, são bastante solúveis em água.\nb) Incorreta. O sal formado tem caráter levemente ácido e pode sofrer hidrólise, portanto o pH não será necessariamente neutro.\nc) Correta. Óxidos anfóteros, como os de zinco ou de alumínio, tem comportamento ácido ou básico a depender da presença de\noutros reagentes. Nesse caso, como o outro reagente é um ácido, o óxido de zinco se comporta como base.\nd) Incorreta. Apesar de ser uma neutralização, o óxido de zinco não é uma base de Arrhenius, afinal ele é um óxido","o":["O sal formado, o formiato de zinco, é um sal pouco solúvel em água, e irá precipitar ao fim desta reação.","O pH da solução final é necessariamente igual a 7,0, afinal o ácido foi neutralizado, e foi formada a água.","O óxido de zinco é um óxido anfótero, apresentando comportamento alcalino na presença do ácido fórmico.","Esta é uma reação de neutralização, afinal os reagentes são um ácido e uma base de Arrhenius."],"c":2},{"id":"n1790722850578","s":"Biologia","t":"Histologia Vegetal","q":"Em diferentes regiões de Santa Catarina, a vegetação está submetida a condições ambientais bastante\ndistintas. Enquanto áreas de restinga e manguezal, no litoral, enfrentam elevada salinidade, ventos intensos e\nforte insolação; formações vegetais do interior convivem com variações térmicas marcantes e solos de\ncaracterísticas diversas. Essas condições selecionam estruturas e tecidos vegetais capazes de garantir\nproteção, sustentação, transporte e crescimento, caracterizando os diferentes tipos de vegetações de nosso\nestado.\nConsiderando a organização histológica dos vegetais e sua relação com a adaptação ao ambiente, assinale a\nalternativa CORRETA.","a":"A epiderme vegetal, revestida em muitas espécies por cutícula, exerce papel de proteção, podendo reduzir a perda de água; já os tecidos vasculares realizam o transporte de substâncias pelo corpo da planta.","r":"A alternativa correta descreve adequadamente a função protetora da epiderme com cutícula (reduzindo a perda de água) e a\nfunção de transporte dos tecidos vasculares (xilema e floema). A alternativa que trata os meristemas apicais como tecidos\npermanentes especializados em fotossíntese está incorreta, pois os meristemas apicais são tecidos de crescimento, formados\npor células indiferenciadas, responsáveis por originar novos tecidos vegetais e não constituem tecido fotossintetizante\nespecializado.\nA alternativa que afirma que parênquima aquífero e colênquima são tecidos meristemáticos secundários, ligados à condução de\nágua e à formação de novos órgãos, está incorreta porque esses tecidos não são meristemas. O parênquima aquífero atua\nprincipalmente no armazenamento de água, enquanto o colênquima exerce função de sustentação em regiões jovens da planta\ne são tecidos adultos.\nA alternativa que apresenta o esclerênquima como tecido de células indiferenciadas, mitoticamente ativas, responsável pelo\ncrescimento primário está incorreta porque o esclerênquima é um tecido de sustentação, geralmente composto por células\nmaduras com paredes espessas, e não por células embrionárias, responsáveis pelo crescimento.","o":["O parênquima aquífero e o colênquima são tecidos meristemáticos secundários, responsáveis, respectivamente, pela condução de água e pela produção de novos órgãos vegetativos.","Os meristemas apicais são tecidos permanentes especializados na fotossíntese e se localizam, principalmente, no interior das folhas jovens.","A epiderme vegetal, revestida em muitas espécies por cutícula, exerce papel de proteção, podendo reduzir a perda de água; já os tecidos vasculares realizam o transporte de substâncias pelo corpo da planta.","O esclerênquima é um tecido formado por células indiferenciadas, com alta atividade mitótica, responsável pelo crescimento primário de caules e raízes."],"c":2},{"id":"n1790722940373","s":"Biologia","t":"Fisiologia Humana","q":"Em campanhas de prevenção de fraturas em idosos, é comum destacar que a perda de massa óssea não\nresulta apenas da redução na ingestão de cálcio, mas também de alterações hormonais capazes de modificar\na atividade relativa de osteoblastos e osteoclastos. Em mulheres, após a menopausa, esse desequilíbrio pode\ntornar a reabsorção óssea mais intensa que a formação de novo tecido, aumentando a fragilidade do esqueleto\nao longo do envelhecimento.\nConsiderando os mecanismos biológicos envolvidos nesse processo, assinale a alternativa CORRETA.","a":"A redução do estrogênio após a menopausa favorece maior reabsorção óssea, pois diminui o controle sobre a atividade dos osteoclastos, contribuindo para a perda de densidade mineral e para o aumento da fragilidade esquelética.","r":"A alternativa correta indica que o estrogênio contribui para modular a atividade e a longevidade dos osteoclastos. Sua redução\napós a menopausa favorece o aumento da reabsorção óssea em relação à formação de novo tecido, resultando em perda de\ndensidade mineral e maior risco de fraturas.\nA alternativa que apresenta a progesterona como principal responsável pela osteoporose e afirma que ela estimula osteoclastos\na incorporar cálcio à matriz óssea está incorreta porque osteoclastos não incorporam cálcio ao tecido ósseo; eles atuam na\nreabsorção óssea. Além disso, o hormônio mais diretamente relacionado a esse contexto é o estrogênio.\nA alternativa que sustenta que a queda de estrogênio e progesterona interrompe a remodelação óssea, bloqueando osteoblastos\ne osteoclastos, está incorreta porque a remodelação não é interrompida. O que ocorre é um desequilíbrio entre formação e\nreabsorção óssea, com aumento relativo da perda mineral.\nA alternativa que atribui à progesterona papel mais decisivo que o estrogênio na densidade óssea e ainda fala em “ação\nreabsortiva dos osteoblastos” está incorreta porque osteoblastos não realizam reabsorção; essa função cabe aos osteoclastos.\nAlém disso, nesse contexto, a queda do estrogênio é o fator hormonal central associado ao aumento do risco de osteoporose\napós a menopausa.","o":["A redução da progesterona, após a menopausa, é o principal fator responsável pela osteoporose, pois esse hormônio estimula diretamente os osteoclastos a incorporar cálcio à matriz óssea e a elevar a resistência mecânica dos ossos.","A redução do estrogênio após a menopausa favorece maior reabsorção óssea, pois diminui o controle sobre a atividade dos osteoclastos, contribuindo para a perda de densidade mineral e para o aumento da fragilidade esquelética.","A queda do estrogênio e da progesterona provoca interrupção da remodelação óssea, uma vez que ambos os hormônios bloqueiam a atividade de osteoblastos e osteoclastos, mantendo o tecido ósseo sem renovação ao longo do envelhecimento.","A diminuição da progesterona tem impacto mais decisivo que a do estrogênio sobre a densidade óssea, porque esse hormônio regula diretamente a fixação de sais minerais no esqueleto e impede a ação reabsortiva dos osteoblastos."],"c":1}]/*END*/;

if(c.o){h+='<div class="qbox">'+esc(c.q)+'</div><div class="opts">'+c.o.map(function(o,i){var z=pick===null?"":i===c.c?" ok":i===pick?" no":"";return'<button class="opt'+z+'" data-pick="'+i+'"'+(pick===null?"":" disabled")+'>'+String.fromCharCode(65+i)+') '+esc(o)+'</button>'}).join("")+'</div>'}
else{h+='<div class="fc'+(flip?" flip":"")+'" id="fc" tabindex="0" role="button" aria-label="Virar card"><div class="in"><div class="face">'+esc(c.q)+'</div><div class="face back">'+esc(c.a)+'</div></div></div>';
if(ans===null)h+=flip?'<div class="row"><button class="cta bad" data-a="e">Errei</button><button class="cta" data-a="h">Acertei</button></div>':'<p class="center mut">Toque no card para ver a resposta</p>'}
if(ans==="e")h+=rv(c);
if(ans!==null)h+='<div class="center"><button class="cta" id="nx">Próximo</button></div>';
return h}

function vBank(){var t=SU(),cs=C(),h=hdr("home")+'<h2 class="h2">Banco de questões</h2><div class="cp"><b>COMPARTILHAR:</b><br>Seus cards ficam salvos só neste navegador. Baixe uma cópia com eles embutidos para enviar a alguém.<br><button class="lnk" id="dl">Baixar cópia com meus cards</button></div>';
h+='<div class="panel'+(ntype==="m"?" mc":"")+'" id="fm"><h3 style="text-decoration:none;font-size:1.3rem;cursor:default">Novo Card/Questão</h3><div class="row"><button class="chip'+(ntype==="s"?" on":"")+'" data-type="s" style="padding:8px 18px">Card simples</button><button class="chip'+(ntype==="m"?" on":"")+'" data-type="m" style="padding:8px 18px">Múltipla escolha</button></div><input id="ns" list="ls" placeholder="Matéria"><datalist id="ls">'+Object.keys(t).map(function(s){return'<option value="'+esc(s)+'">'}).join("")+'</datalist><input id="nt" placeholder="Subtema"><textarea id="nq" rows="2" placeholder="Pergunta"></textarea><textarea id="na" class="sf" rows="2" placeholder="Resposta [card simples]"></textarea><div class="mcf">'+[0,1,2,3].map(function(i){return'<input id="o'+i+'" placeholder="Alternativa '+String.fromCharCode(65+i)+'">'}).join("")+'<select id="oc"><option value="0">Correta: A</option><option value="1">Correta: B</option><option value="2">Correta: C</option><option value="3">Correta: D</option></select></div><textarea id="nr" rows="2" placeholder="Resumo do conteúdo (aparece quando o usuário errar)"></textarea></div>';
h+='<div class="center">'+(note?'<p class="warn">'+note+'</p>':'')+'<button class="cta" id="add">Adicionar Card</button></div><h2 class="h2" style="font-size:1.4rem">Todas as questões</h2>';
Object.keys(t).forEach(function(s){var l=cs.filter(function(c){return c.s===s});if(!l.length)return;h+='<details class="cp"><summary>'+esc(s)+' ('+l.length+')</summary>'+l.map(function(c){return'<div class="li"><span><small>'+esc(c.t)+(c.o?" · múltipla escolha":"")+'</small><br>'+esc(c.q)+'</span><button data-del="'+c.id+'" aria-label="Excluir questão">×</button></div>'}).join("")+'</details>'});
return h}

function vStats(){var cs=C(),a=agg(cs),t=SU(),h=hdr("home")+'<h2 class="h2">Minhas estatísticas</h2><div class="pills"><div class="pill">Acertos<b>'+a.h+'</b></div><div class="pill">Erros<b>'+a.e+'</b></div><div class="pill wide">Aproveitamento<b>'+(a.p===null?"–":Math.round(a.p*100)+"%")+'</b></div></div><div class="cp"><h3 class="h3">Por matéria (da mais fraca à mais forte)</h3>';
var ss=Object.keys(t).map(function(s){var r=agg(cs.filter(function(c){return c.s===s}));r.n=s;return r}).filter(function(r){return r.h+r.e>0}).sort(byP);
if(!ss.length)h+='<p>Ainda sem dados. Responda algumas questões em Estudar.</p>';
ss.forEach(function(r){h+='<div class="grp"><div class="sr"><b>'+esc(r.n)+'</b><span>'+lab(r)+'</span></div>'+bar(r)+'<button class="lnk" data-open="'+esc(r.n)+'">'+(opn[r.n]?"Ocultar":"Ver")+' subtemas</button>';
if(opn[r.n])t[r.n].map(function(x){var b=agg(cs.filter(function(c){return c.s===r.n&&c.t===x}));b.n=x;return b}).filter(function(b){return b.h+b.e>0}).sort(byP).forEach(function(b){h+='<div class="sub"><div class="sr"><span>'+esc(b.n)+'</span><span>'+lab(b)+'</span></div>'+bar(b)+'</div>'});
h+='</div>'});
h+='</div><div class="cp"><h3 class="h3">O que estudar primeiro</h3>';
var w=cs.filter(function(c){return st(c).e>0}).sort(function(a,b){return(st(b).e-st(b).h)-(st(a).e-st(a).h)}).slice(0,8);
h+=w.length?w.map(function(c){return'<div class="li" data-open="'+c.id+'" role="button" tabindex="0"><span>'+esc(c.q)+'<br><small>'+esc(c.s+" · "+c.t)+'</small></span><span class="badge">'+st(c).e+' erros</span></div>'+(opn[c.id]?rv(c):"")}).join(""):'<p>Nenhum erro registrado ainda.</p>';
return h+'</div><div class="center">'+(cr?'<b>Zerar todo o histórico?</b><br><button class="cta bad" id="rz">Sim, zerar</button><button class="cta" id="rc">Cancelar</button>':'<button class="cta" id="reset">Zerar histórico</button>')+'</div>'}

function render(){document.getElementById("app").innerHTML=({home:vHome,pick:vPick,run:vRun,bank:vBank,stats:vStats,edit:vEdit})[scr]();if(scr!==last){window.scrollTo(0,0);last=scr}}

/* ===== AÇÕES ===== */
function mk(){var n=Object.keys(sel).length;if(!n&&!onlyErr){warn="Selecione ao menos um subtema.";return}
var l=C().filter(function(c){return!n||sel[k(c)]});if(onlyErr)l=l.filter(function(c){return st(c).e>0});
if(!l.length){warn=onlyErr?"Você ainda não errou nenhuma questão nesta seleção.":"Ainda não há questões nesses subtemas. Adicione no Banco de questões.";return}
warn="";Q=l.slice().sort(function(){return Math.random()-.5});qi=0;flip=false;pick=null;ans=null;ses={h:0,e:0};scr="run"}
function add(){var g=function(i){return document.getElementById(i).value.trim()},c={id:"u"+Date.now(),s:g("ns"),t:g("nt"),q:g("nq"),r:g("nr")};
if(!c.s||!c.t||!c.q){note="Preencha matéria, subtema e pergunta.";return}
if(ntype==="m"){var raw=[0,1,2,3].map(function(i){return g("o"+i)}),ct=raw[+g("oc")],os=raw.filter(Boolean);if(os.length<2||!ct){note="Preencha ao menos 2 alternativas e marque uma correta que não esteja vazia.";return}c.o=os;c.c=os.indexOf(ct);c.a=ct}
else{c.a=g("na");if(!c.a){note="Preencha a resposta.";return}}
P.u.push(c);sv();note="Card adicionado!"}
function del(id){P.u=P.u.filter(function(c){return c.id!==id});if(SITE.some(function(c){return c.id===id}))P.x.push(id);delete P.st[id];sv()}

/* ===== MODO DESENVOLVEDOR (#admin) ===== */
function fe(c,mc){c=c||{};var o=c.o||["","","",""];return'<div class="fe"><input id="es" placeholder="Matéria" value="'+esc(c.s||"")+'"><input id="et" placeholder="Subtema" value="'+esc(c.t||"")+'"><textarea id="eq" rows="2" placeholder="Pergunta">'+esc(c.q||"")+'</textarea>'+(mc?[0,1,2,3].map(function(i){return'<input id="eo'+i+'" placeholder="Alternativa '+String.fromCharCode(65+i)+'" value="'+esc(o[i]||"")+'">'}).join("")+'<select id="ec">'+[0,1,2,3].map(function(i){return'<option value="'+i+'"'+(c.c===i?" selected":"")+'>Correta: '+String.fromCharCode(65+i)+'</option>'}).join("")+'</select>':'<textarea id="ea" rows="2" placeholder="Resposta">'+esc(c.a||"")+'</textarea>')+'<textarea id="er" rows="2" placeholder="Resumo do conteúdo">'+esc(c.r||"")+'</textarea><input id="el" placeholder="Link da aula só desta questão (opcional)" value="'+esc(c.l||"")+'"><div class="row"><button class="cta" id="eds" data-mc="'+(mc?1:0)+'">Salvar</button><button class="cta bad" id="edx">Cancelar</button>'+(c.id?'<button class="cta bad" id="edd">Excluir</button>':'')+'</div></div>'}
function vEdit(){var t=SU(),h=hdr("home")+'<h2 class="h2">Modo desenvolvedor</h2><p class="mut">As mudanças aparecem aqui na hora, mas só chegam aos usuários depois de baixar o arquivo e subir no GitHub.</p>';
h+='<div class="cp"><h3 class="h3">Aparência e textos</h3><div class="ed">'+[["c1","Vermelho (topo)"],["c2","Vermelho (base)"],["b1","Fundo (topo)"],["b2","Fundo (base)"],["ac","Destaque"]].map(function(x){return'<label>'+x[1]+'<input type="color" data-th="'+x[0]+'" value="'+TH[x[0]]+'"></label>'}).join("")+'</div>'+[["logo","Nome do app"],["tag","Frase da tela inicial"],["pick","Título da tela Estudar"]].map(function(x){return'<label>'+x[1]+'<input data-tx="'+x[0]+'" value="'+esc(TX[x[0]])+'"></label>'}).join("")+'</div>';
h+='<div class="cp"><h3 class="h3">Links das aulas (por subtema)</h3>';
Object.keys(t).forEach(function(s){h+='<details><summary>'+esc(s)+'</summary>'+t[s].map(function(x){return'<label>'+esc(x)+'<input data-au="'+esc(s+"|"+x)+'" placeholder="https://youtube.com/..." value="'+esc(AULAS[s+"|"+x]||"")+'"></label>'}).join("")+'</details>'});
h+='</div><div class="cp"><h3 class="h3">Questões do site</h3><div class="row"><button class="chip" data-ed="new-s" style="padding:8px 18px">+ Card simples</button><button class="chip" data-ed="new-m" style="padding:8px 18px">+ Múltipla escolha</button></div>'+(note?'<p class="warn">'+note+'</p>':'');
if(edit&&edit.indexOf("new")===0)h+=fe(null,edit==="new-m");
Object.keys(t).forEach(function(s){var l=SITE.filter(function(c){return c.s===s});if(!l.length)return;h+='<details'+(s===edS?" open":"")+'><summary>'+esc(s)+' ('+l.length+')</summary>'+l.map(function(c){return edit===c.id?fe(c,!!c.o):'<div class="li"><span><small>'+esc(c.t)+(c.o?" · múltipla escolha":"")+'</small><br>'+esc(c.q)+'</span><button data-ed="'+c.id+'" aria-label="Editar questão">✎</button></div>'}).join("")+'</details>'});
return h+'</div><div class="center"><button class="cta" id="pub">Baixar index.html para publicar</button><br>'+(crE?'<b>Descartar todas as edições deste navegador?</b><br><button class="cta bad" id="edrz">Sim, descartar</button><button class="cta" id="edrc">Cancelar</button>':'<button class="lnk" id="edr">Descartar edições</button>')+'</div>'}
function saveEd(){var g=function(i){var e=document.getElementById(i);return e?e.value.trim():""},mc=document.getElementById("eds").dataset.mc==="1",c={s:g("es"),t:g("et"),q:g("eq"),r:g("er"),l:g("el")};
if(!c.s||!c.t||!c.q){note="Preencha matéria, subtema e pergunta.";return}
if(mc){var raw=[0,1,2,3].map(function(i){return g("eo"+i)}),ct=raw[+g("ec")],os=raw.filter(Boolean);if(os.length<2||!ct){note="Preencha ao menos 2 alternativas e marque uma correta preenchida.";return}c.o=os;c.c=os.indexOf(ct);c.a=ct}
else{c.a=g("ea");if(!c.a){note="Preencha a resposta.";return}}
if(!c.l)delete c.l;var ix=-1;SITE.forEach(function(x,i){if(x.id===edit)ix=i});
if(ix>=0){c.id=edit;SITE[ix]=c}else{c.id="n"+Date.now();SITE.push(c)}
edS=c.s;edit=null;note="";edSave()}
function delEd(){SITE.forEach(function(x,i){if(x.id===edit)SITE.splice(i,1)});edit=null;note="";edSave()}
function inj(s,k,o){return s.replace(new RegExp("/\\*"+k+"\\*/[\\s\\S]*?/\\*END\\*/"),function(){return"/*"+k+"*/"+JSON.stringify(o).replace(/</g,"\\u003c")+"/*END*/"})}
function dl(pub){var d=document.documentElement.cloneNode(true);d.removeAttribute("style");d.querySelector("#app").innerHTML="";
var cards=(pub&&ADM?SITE:C()).map(function(c){var x={id:c.id,s:c.s,t:c.t,q:c.q,a:c.a,r:c.r};if(c.o){x.o=c.o;x.c=c.c}if(c.l)x.l=c.l;return x});
var sc=d.querySelector("script:not([src])"),x=sc.textContent;x=inj(x,"EMB",cards);x=inj(x,"TH",TH);x=inj(x,"TX",TX);x=inj(x,"AU",AULAS);sc.textContent=x;
var a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["<!DOCTYPE html>\n"+d.outerHTML],{type:"text/html"}));a.download="index.html";document.body.appendChild(a);a.click();a.remove()}

document.addEventListener("click",function(ev){var b=ev.target.closest("[data-go],[data-err],[data-subj],[data-k],[data-pick],[data-a],[data-type],[data-open],[data-del],#mk,#fc,#nx,#add,#dl,#reset,#rz,#rc,[data-ed],#eds,#edx,#edd,#pub,#edr,#edrz,#edrc");if(!b)return;var d=b.dataset;
if(d.go){scr=d.go;cr=false;warn="";note=""}
else if(d.err){onlyErr=!onlyErr}
else if(d.subj){var ks=SU()[d.subj].map(function(x){return d.subj+"|"+x}),al=ks.every(function(x){return sel[x]});ks.forEach(function(x){if(al)delete sel[x];else sel[x]=1})}
else if(d.k){if(sel[d.k])delete sel[d.k];else sel[d.k]=1}
else if(b.id==="mk"){mk()}
else if(b.id==="fc"){flip=!flip;b.classList.toggle("flip");setTimeout(render,500);return}
else if(d.pick){if(pick!==null)return;var c=Q[qi];pick=+d.pick;rec(c,pick===c.c);ans=pick===c.c?"h":"e"}
else if(d.a){rec(Q[qi],d.a==="h");if(d.a==="h")adv();else ans="e"}
else if(b.id==="nx"){adv()}
else if(d.type){ntype=d.type;var f=document.getElementById("fm");f.classList.toggle("mc",ntype==="m");[].forEach.call(f.querySelectorAll("[data-type]"),function(x){x.classList.toggle("on",x.dataset.type===ntype)});return}
else if(d.open){opn[d.open]=!opn[d.open]}
else if(d.del){del(d.del)}
else if(b.id==="add"){add()}
else if(b.id==="dl"){return dl()}
else if(d.ed){edit=d.ed;note="";if(d.ed.indexOf("new")<0)SITE.forEach(function(c){if(c.id===d.ed)edS=c.s})}
else if(b.id==="eds"){saveEd()}
else if(b.id==="edx"){edit=null;note=""}
else if(b.id==="edd"){delEd()}
else if(b.id==="pub"){return dl(true)}
else if(b.id==="edr"){crE=true}
else if(b.id==="edrc"){crE=false}
else if(b.id==="edrz"){try{localStorage.removeItem("szk-ed")}catch(e){}location.reload();return}
else if(b.id==="reset"){cr=true}
else if(b.id==="rc"){cr=false}
else if(b.id==="rz"){P.st={};cr=false;sv()}
render()});
document.addEventListener("keydown",function(ev){if((ev.key==="Enter"||ev.key===" ")&&ev.target.getAttribute&&ev.target.getAttribute("role")==="button"){ev.preventDefault();ev.target.click()}});
document.addEventListener("input",function(ev){var d=ev.target.dataset;if(!d)return;
if(d.th){TH[d.th]=ev.target.value;applyTh();edSave()}
else if(d.tx){TX[d.tx]=ev.target.value;applyTh();edSave()}
else if(d.au){var v=ev.target.value.trim();if(v)AULAS[d.au]=v;else delete AULAS[d.au];edSave()}});
window.addEventListener("hashchange",function(){location.reload()});
applyTh();render();
</script>
